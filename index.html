<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2933">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Наставник">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Карманный наставник</title>
<style>
:root{
  --bg:#E8ECEF; --surf:#FFFFFF; --surf2:#F2F5F7; --ink:#16212A; --mute:#5A6A77; --line:#CBD4DB;
  --mark:#F2C230; --markInk:#1B1B1B; --ok:#2B9457; --warn:#C9781A; --bad:#C53B31; --info:#2C68A8;
  --okBg:#DCF1E4; --warnBg:#FBEBD3; --badBg:#F9DEDB; --infoBg:#DCE8F5;
  --r:14px; --tap:48px;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121A20; --surf:#1C262F; --surf2:#25323D; --ink:#E7EDF1; --mute:#93A2AE; --line:#33424E;
    --okBg:#173627; --warnBg:#3A2A12; --badBg:#3D1C19; --infoBg:#18304A;
    --ok:#4CC27E; --warn:#F0A040; --bad:#F06A5F; --info:#6FA8E6;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}

/* Верхняя полоса — разметка пола */
.band{height:6px;background:repeating-linear-gradient(135deg,var(--mark) 0 14px,#2A333A 14px 28px)}
header.top{position:sticky;top:0;z-index:5;background:var(--surf);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:10px;padding:0 16px;height:56px}
.topin h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topin .who{font-size:13px;color:var(--mute);text-align:right;line-height:1.25}
.back{border:0;background:var(--surf2);border-radius:12px;min-width:var(--tap);height:40px;font-size:20px}

main{max-width:640px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom,0px))}

nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surf);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bot button{flex:1;border:0;background:none;padding:8px 4px 10px;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.bot button .ic{font-size:22px;line-height:1}
nav.bot button.on{color:var(--ink);font-weight:600}
nav.bot button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;background:var(--mark);border-radius:0 0 3px 3px}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 6px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surf);font-weight:600;text-align:center}
.btn.main{background:var(--mark);color:var(--markInk);border-color:transparent}
.btn.dark{background:var(--ink);color:var(--surf);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.wide{width:100%}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1}

.note{background:var(--surf);border:1px solid var(--line);border-left:5px solid var(--mark);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;font-size:15px}
.note b{display:block;margin-bottom:4px}
.note .row{margin-top:10px}
.muted{color:var(--mute)}
.small{font-size:13px}
h2{font-size:17px;margin:22px 2px 10px}
h2:first-child{margin-top:4px}

/* Карточка подопечного */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.tap{cursor:pointer}
.chead{display:flex;align-items:flex-start;gap:10px}
.chead .nm{font-weight:700;font-size:17px;line-height:1.25}
.chead .sub{font-size:13px;color:var(--mute);margin-top:2px}
.chead .num{margin-left:auto;text-align:right;flex-shrink:0}
.chead .num b{font-size:26px;line-height:1;display:block;font-variant-numeric:tabular-nums}
.chead .num span{font-size:11px;color:var(--mute)}

/* Лесенка смен */
.ladder{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin:12px 0 6px}
.ladder i{height:14px;border-radius:3px;background:var(--surf2);border:1px solid var(--line);position:relative}
.ladder i.f{background:var(--ink);border-color:var(--ink)}
.ladder i.m{border:2px solid var(--mark)}
.ladder i.m.f{background:var(--ink)}
.ladder i.m.done::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--mark)}
.ladcap{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:13px;padding:4px 10px;border-radius:20px;background:var(--surf2);border:1px solid var(--line);line-height:1.3}
.chip.bad{background:var(--badBg);border-color:transparent;color:var(--bad);font-weight:600}
.chip.warn{background:var(--warnBg);border-color:transparent;color:var(--warn);font-weight:600}
.chip.ok{background:var(--okBg);border-color:transparent;color:var(--ok);font-weight:600}
.chip.info{background:var(--infoBg);border-color:transparent;color:var(--info);font-weight:600}
.cact{display:flex;gap:8px;margin-top:12px}
.cact .btn{flex:1}

.bar{height:8px;border-radius:5px;background:var(--surf2);overflow:hidden;border:1px solid var(--line)}
.bar>span{display:block;height:100%;background:var(--ok)}
.barrow{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute);margin-top:8px}
.barrow .bar{flex:1}

/* Вкладки внутри карточки */
.tabs{display:flex;gap:4px;background:var(--surf2);border-radius:12px;padding:4px;margin:4px 0 14px;position:sticky;top:57px;z-index:4}
.tabs button{flex:1;border:0;background:none;border-radius:9px;min-height:40px;font-size:14px;font-weight:600;color:var(--mute)}
.tabs button.on{background:var(--surf);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* Навыки */
.skill{padding:12px 0;border-top:1px solid var(--line)}
.skill:first-of-type{border-top:0}
.skill .sn{font-size:15px;margin-bottom:8px}
.skill .sd{font-size:12px;color:var(--mute);margin-top:6px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.seg button{border:1px solid var(--line);background:var(--surf2);border-radius:9px;min-height:40px;font-size:12.5px;padding:2px;line-height:1.15}
.seg button.on.l0{background:var(--surf);border-color:var(--ink);font-weight:700}
.seg button.on.l1{background:var(--infoBg);border-color:var(--info);color:var(--info);font-weight:700}
.seg button.on.l2{background:var(--warnBg);border-color:var(--warn);color:var(--warn);font-weight:700}
.seg button.on.l3{background:var(--okBg);border-color:var(--ok);color:var(--ok);font-weight:700}
.ghead{display:flex;justify-content:space-between;align-items:baseline}
.ghead b{font-size:16px}

/* История смен */
.hist{display:flex;gap:12px}
.hist .dt{flex-shrink:0;width:54px;text-align:center;border-radius:10px;background:var(--surf2);padding:6px 0}
.hist .dt b{display:block;font-size:20px;line-height:1.1}
.hist .dt span{font-size:11px;color:var(--mute)}
.hist .bd{flex:1;min-width:0}
.hist .bd p{margin:6px 0 0;font-size:15px;white-space:pre-wrap;word-wrap:break-word}

/* Формы */
label.f,div.f{display:block;margin-bottom:16px}
label.f>span{display:block;font-size:14px;color:var(--mute);margin-bottom:6px}
input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;min-height:var(--tap);border-radius:12px;border:1px solid var(--line);background:var(--surf2);padding:10px 12px;font-size:16px}
textarea{min-height:88px;resize:vertical}
.pick{display:grid;gap:6px}
.pick.c2{grid-template-columns:1fr 1fr}
.pick.c5{grid-template-columns:repeat(5,1fr)}
.pick button{border:1px solid var(--line);background:var(--surf2);border-radius:12px;min-height:var(--tap);font-weight:600;padding:4px}
.pick button.on{background:var(--ink);color:var(--surf);border-color:var(--ink)}
.pick.c5 button{font-size:20px}
.pick.c5 button small{display:block;font-size:10.5px;font-weight:500}
.tagset{display:flex;flex-wrap:wrap;gap:6px}
.tagset button{border:1px solid var(--line);background:var(--surf2);border-radius:20px;padding:8px 12px;font-size:14px}
.tagset button.on{background:var(--ink);color:var(--surf);border-color:var(--ink)}
.tagset button.tg{border-width:1.5px;text-align:left;line-height:1.25}
.tg.pos{border-color:var(--ok);color:var(--ok)}
.tg.neg{border-color:var(--bad);color:var(--bad)}
.tg.neu{border-color:var(--warn);color:var(--warn)}
.tagset button.tg.on.pos{background:var(--ok);border-color:var(--ok);color:var(--surf)}
.tagset button.tg.on.neg{background:var(--bad);border-color:var(--bad);color:var(--surf)}
.tagset button.tg.on.neu{background:var(--warn);border-color:var(--warn);color:var(--surf)}
.tg[aria-disabled="true"]{opacity:.4}
.tg small{display:block;font-size:11px;opacity:.85;font-weight:400}
.tgh{font-size:14px;font-weight:700;margin:14px 0 6px}
.tgh span{font-weight:400}
.tgfoot{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.linkbtn{border:0;background:none;color:var(--info);font-weight:600;padding:8px 0;min-height:40px}
.qrow{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.qrow button{flex-shrink:0;border:1px solid var(--line);background:var(--surf);border-radius:20px;padding:8px 12px;font-size:14px;min-height:40px;white-space:nowrap}
.qrow button.rec{border-color:var(--bad);color:var(--bad);font-weight:700}
.cnt{text-align:right;font-size:12px;color:var(--mute);margin-top:4px}
textarea.grow{min-height:var(--tap);height:var(--tap);resize:none;overflow:hidden;line-height:1.4}
.helpbar{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surf2);color:var(--mute);text-align:left;margin:6px 0 10px}
.helpbar .hic{font-size:26px;line-height:1;flex-shrink:0}
.helpbar b{display:block;color:var(--mute);font-size:16px}
.helpbar small{display:block;font-size:13px}
.helpbar.on{background:var(--bad);border-color:var(--bad);color:#fff}
.helpbar.on b{color:#fff}
.helpbar.pulse{animation:hpulse .5s ease-out 1}
@keyframes hpulse{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.helpbar.pulse{animation:none}}
.helpbar.sm{min-height:48px;padding:8px 12px;margin:8px 0 0}
.helpbar.sm b{font-size:15px}
.reasons{margin-bottom:8px}
.reasons button{font-size:14px}
.reasons button.on{background:var(--bad);border-color:var(--bad);color:#fff}
.chip.tp{color:var(--ok);border-color:var(--ok)}
.chip.tn{color:var(--bad);border-color:var(--bad)}
.chip.tz{color:var(--warn);border-color:var(--warn)}
.check{display:flex;align-items:center;gap:12px;min-height:var(--tap);padding:6px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surf2);margin-bottom:8px}
.check input{width:22px;height:22px;flex-shrink:0}
.check.alert{border-color:var(--bad)}

/* Нижний лист */
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.open{display:block}
#sheet .shade{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#sheet .pane{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--surf);border-radius:18px 18px 0 0;
  padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#sheet .pane{animation:none}}
.grip{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.pane h3{font-size:18px;margin:0 0 4px}
.pane .lead{font-size:14px;color:var(--mute);margin:0 0 16px}
.pane .actions{display:flex;gap:10px;margin-top:18px;position:sticky;bottom:-18px;background:var(--surf);padding:10px 0 4px}
.pane .actions .btn{flex:1}

#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surf);
  padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}

.empty{text-align:center;padding:28px 12px}
.empty .big{font-size:44px}
.empty p{color:var(--mute);margin:8px 0 18px}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list-item:first-child{border-top:0}
.list-item span{flex:1}
.x{border:0;background:var(--surf2);border-radius:10px;width:40px;height:40px;font-size:16px;color:var(--mute)}
details.arch summary{cursor:pointer;padding:10px 2px;color:var(--mute);font-weight:600}
.sign{text-align:center;font-size:12px;color:var(--mute);margin:26px 0 6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--mute)}
.kv dd{margin:0}
.big-send{padding:22px 16px;text-align:center}
.big-send .n{font-size:44px;font-weight:800;line-height:1}
.task{margin-top:10px;padding:8px 12px;border-radius:10px;background:var(--surf2);border:1px dashed var(--line);font-size:14px}
.task b{font-weight:600}
.risk{margin-top:10px;padding:8px 12px;border-radius:10px;background:var(--badBg);color:var(--bad);font-size:14px}
.risk b{display:block}
.adm{margin:6px 0 2px;padding:10px 12px;border-radius:10px;background:var(--surf2)}
.adm .row{margin-top:8px}
.hints{background:var(--surf2);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.hints summary{cursor:pointer;font-weight:600}
.hints ul{margin:8px 0 2px;padding-left:18px}
.hints li{margin:4px 0}
.sq{margin-bottom:14px}
.sq>div:first-child{font-size:15px;margin-bottom:6px}
.pick.c5n button{font-size:17px}
.pick.c5n button small{display:block;font-size:10px;font-weight:500;line-height:1.1}
.ans{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0;border-top:1px solid var(--line)}
.ans:first-child{border-top:0}
.ans b.low{color:var(--bad)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--mute)}
.stat.wide{grid-column:1/-1}
.hbar{margin:10px 0}
.hbar .lbl{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px;gap:8px}
.hbar .bar>span.w{background:var(--warn)}
.hbar .bar>span.b{background:var(--bad)}
</style>
</head>
<body>
<div class="band" aria-hidden="true"></div>
<div id="app"></div>
<div id="sheet" role="dialog" aria-modal="true"><div class="shade" data-act="closeSheet"></div><div class="pane" id="pane"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" hidden>

<script>
'use strict';
/* =====================================================================
   Карманный наставник — РЦ Екатеринбург Юг
   Все данные хранятся только в памяти браузера на телефоне наставника.
   Передача руководителю смены — файлом через «Поделиться».
   ===================================================================== */
const APP_VERSION = '1.5';
const KEY = 'nastavnik_v1';
const SIGN = 'Идея и реализация - Evgeny.Panasevich, РЦ Екатеринбург-ЮГ + Copilot x5';

const GROUPS = [['common','Общее'],['pick','Комплектация']];   // v1.4: отгрузка, ВЭШ и приёмка убраны из чек-листа
const GNAME = Object.fromEntries(GROUPS);
const WORK_GROUPS = GROUPS.filter(g => g[0] !== 'common');
const DEFAULT_CHECKLIST = {
  common: ['Вводный инструктаж и охрана труда','Работа с ТСД: вход, задания, ошибки','Адресация ячеек и схема склада','Порядок на рабочем месте и СИЗ'],
  pick:   ['Отбор по заданию на ТСД','Пересчёт и сверка артикула','Формирование и стретчевание паллеты','Маркировка собранного груза','Действия при недостаче и пересорте']
};
const LEVELS = ['Не начато','Показал','Под контролем','Допущен'];
const LEVELS_SHORT = ['Не начато','Показал','Под\u00A0контролем','Допущен'];
const MEET = [3,7,14];
const SURVEY = [
  ['clear','Понятно, что и как делать на смене'],
  ['help', 'Наставник и коллеги помогают, когда нужно'],
  ['load', 'Нагрузка посильная'],
  ['sched','График и условия устраивают'],
  ['stay', 'Хочу и дальше работать здесь']
];
const SURVEY_SCALE = ['', 'Нет', 'Скорее нет', 'Не знаю', 'Скорее да', 'Да'];
const MEET_HINTS = {
  3:  { focus: 'Первые впечатления и бытовые мелочи. Главное — чтобы новичок не остался с вопросом, который постеснялся задать.',
        q: ['Что оказалось не так, как ожидал при найме?','Хватает ли объяснений? Что было непонятно?','Удобно ли добираться, подходит ли время смены?','Выдали ли форму и СИЗ, всё ли по размеру?','Знаешь, к кому обращаться, если что-то случилось?'] },
  7:  { focus: 'Обучение и коллектив. Похвалите конкретно за то, что уже получается, и договоритесь, над чем работать дальше.',
        q: ['Что уже получается уверенно?','Что пока даётся тяжело?','Как складываются отношения в смене?','Понятно ли, как считается зарплата и премия?','Есть ли что-то, что хочется изменить в обучении?'] },
  14: { focus: 'Итоги адаптации и планы. Узнайте, готов ли работать сам и что держит на складе.',
        q: ['Готов ли работать самостоятельно по основным операциям?','Что в обучении было лишним, а чего не хватило?','Интересно ли освоить другие операции или ВЭШ?','Остаёшься? Что могло бы заставить уйти?','Позвал бы знакомых работать к нам?'] }
};
/* Метки «Что заметили». s: 1 — хорошо, -1 — проблема, 0 — нейтрально. core — видны сразу, остальные — по кнопке «Ещё…» */
const TAG_GROUPS = [
  ['base',  'Обучение', 0],
  ['safe',  '🛡️ Безопасность и СИЗ', 0],
  ['qual',  '📦 Качество операций', 4],   // после 3 отмеченных смен
  ['team',  '👥 Команда и общение', 0],
  ['grow',  '📈 Рост и готовность', 3],   // с 3-й смены
  ['disc',  '⏱️ Дисциплина', 0],
  ['state', '🏥 Состояние', 0]
];

];
const TAG_MAP = Object.fromEntries(TAG_DEFS.map(d => [d.t, d]));
const tagSign = t => (TAG_MAP[t] ? TAG_MAP[t].s : 0);
const tagChipCls = t => { const s = tagSign(t); return s > 0 ? 'tp' : s < 0 ? 'tn' : 'tz'; };
const MAX_TAGS = 4;
const LOAD_TAGS = ['Жалуется на нагрузку','Плохо переносит нагрузку','Жалуется на усталость или здоровье'];
const PHRASES = [
  ['✅ Всё по плану', 'Смена прошла штатно, замечаний нет.'],

  ['📋 Завтра: …', 'Завтра: повторная проверка + самостоятельный отбор.']
];
const COMMENT_MAX = 200;
const HELP_REASONS = [['leave','🔴 Риск ухода'],['safety','🛡️ Нарушение ТБ'],['conflict','🤝 Конфликт'],['other','💬 Другое']];
const HELP_LABEL = { leave:'Риск ухода', safety:'Нарушение ТБ', conflict:'Конфликт', other:'Другое' };
const helpTitle = n => n.helpReason ? 'Нужна помощь: ' + HELP_LABEL[n.helpReason].toLowerCase() : 'Нужна помощь руководителя';
const SCORE = ['', 'Плохо', 'Слабо', 'Норм', 'Хорошо', 'Отлично'];
const SCORE_IC = ['', '😟', '😕', '😐', '🙂', '😃'];

/* ---------- утилиты ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function isoLocal(d){ const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0,10); }
const today = () => isoLocal(new Date());
function shiftDefaultDate(){ const d = new Date(); if (d.getHours() < 8) d.setDate(d.getDate() - 1); return isoLocal(d); }
function fmt(iso){ if(!iso) return '—'; const [y,m,d] = iso.split('-'); return `${d}.${m}.${y}`; }
function fmtTs(ts){ if(!ts) return '—'; const d = new Date(ts); return `${fmt(isoLocal(d))} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
const MON = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
function plural(n, a, b, c){ n = Math.abs(n) % 100; const n1 = n % 10; if (n > 10 && n < 20) return c; if (n1 > 1 && n1 < 5) return b; if (n1 === 1) return a; return c; }
function shortFio(f){ const p = String(f||'').trim().split(/\s+/); if (p.length < 2) return p[0] || ''; return p[0] + ' ' + p.slice(1).map(x => x[0] + '.').join(''); }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }
function fileStamp(){ const d = new Date(); return isoLocal(d) + '_' + String(d.getHours()).padStart(2,'0') + String(d.getMinutes()).padStart(2,'0'); }

/* ---------- хранилище ---------- */
function makeChecklist(){
  const c = {};
  for (const [g] of GROUPS) c[g] = DEFAULT_CHECKLIST[g].map((name, i) => ({ id: `${g}_${i+1}`, name }));
  return c;
}
function blankState(){
  return { v: 1, settings: { fio:'', tab:'', shift:'', leader:'', division:'РЦ Екатеринбург Юг', checklist: makeChecklist(), installHidden:false },
           mentees: [], lastSentAt: 0, sentLog: [] };
}
let S;
function load(){
  try { const raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : blankState(); }
  catch(e){ S = blankState(); }
  const b = blankState();
  S.settings = Object.assign(b.settings, S.settings || {});
  for (const [g] of GROUPS) if (!Array.isArray(S.settings.checklist[g])) S.settings.checklist[g] = b.settings.checklist[g];
  for (const g of Object.keys(S.settings.checklist)) if (!GNAME[g]) delete S.settings.checklist[g];
  S.mentees = Array.isArray(S.mentees) ? S.mentees : [];
  S.mentees.forEach(normMentee);
  S.sentLog = Array.isArray(S.sentLog) ? S.sentLog : [];
  S.lastSentAt = +S.lastSentAt || 0;
}
function normMentee(m){
  m.id = m.id || uid(); m.fio = m.fio || ''; m.tab = m.tab || ''; m.hireDate = m.hireDate || '';
  const before = JSON.stringify([m.mainGroup, m.groups, m.admissions]);
  m.mainGroup = WORK_GROUPS.some(g => g[0] === m.mainGroup) ? m.mainGroup : WORK_GROUPS[0][0];
  m.groups = (Array.isArray(m.groups) ? m.groups : []).filter(g => WORK_GROUPS.some(x => x[0] === g));
  if (!m.groups.length) m.groups = [m.mainGroup];
  if (m.admissions) for (const g of Object.keys(m.admissions)) if (!WORK_GROUPS.some(x => x[0] === g)) delete m.admissions[g];
  if (m.mainGroup && before !== JSON.stringify([m.mainGroup, m.groups, m.admissions]) && m.updatedAt) m.updatedAt = Date.now();   // уйдёт в следующий отчёт
  if (!m.groups.includes(m.mainGroup)) m.groups.unshift(m.mainGroup);
  m.shiftsBefore = +m.shiftsBefore || 0; m.status = m.status || 'active';
  m.skills = m.skills || {}; m.notes = Array.isArray(m.notes) ? m.notes : []; m.meetings = m.meetings || {};
  m.admissions = m.admissions || {};
  m.createdAt = m.createdAt || Date.now(); m.updatedAt = m.updatedAt || Date.now();
  return m;
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch(e){ toast('Не удалось сохранить: память браузера недоступна'); return false; }
}
function touch(m){ m.updatedAt = Date.now(); save(); }
const findM = id => S.mentees.find(m => m.id === id);

/* ---------- расчёты ---------- */
const presentNotes = m => m.notes.filter(n => n.present);
const worked = m => (+m.shiftsBefore || 0) + presentNotes(m).length;
function stageOf(n){ if (n <= 3) return 'Знакомство'; if (n <= 7) return 'Обучение'; if (n <= 14) return 'Закрепление'; return 'Самостоятельная работа'; }
const groupsOf = m => ['common', ...m.groups.filter(g => g !== 'common')];
function skillItems(m, g){ return (S.settings.checklist[g] || []); }
function progress(m, onlyGroup){
  const gs = onlyGroup ? [onlyGroup] : groupsOf(m);
  let sum = 0, cnt = 0;
  for (const g of gs) for (const it of skillItems(m, g)) { sum += (m.skills[it.id]?.lvl || 0); cnt++; }
  return cnt ? Math.round(sum / (cnt * 3) * 100) : 0;
}
function countLevels(m){
  const c = [0,0,0,0];
  for (const g of groupsOf(m)) for (const it of skillItems(m, g)) c[m.skills[it.id]?.lvl || 0]++;
  return c;
}
const meetDone = (m, k) => !!(m.meetings[k] && m.meetings[k].done);
function nextMeeting(m){ for (const k of MEET) if (!meetDone(m, k)) return k; return null; }
const meetingDue = m => { const k = nextMeeting(m); return k !== null && worked(m) >= k ? k : null; };
const openHelp = m => m.notes.filter(n => n.help && !n.helpResolved);
const sortedNotes = m => [...m.notes].sort((a, b) => b.date.localeCompare(a.date) || b.ts - a.ts);
const lastNote = m => sortedNotes(m)[0];
const unsent = () => S.mentees.filter(m => m.updatedAt > S.lastSentAt);
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
function shiftNoAt(m, date){ return (+m.shiftsBefore || 0) + m.notes.filter(n => n.present && n.date <= date).length; }
function findSkill(id){
  for (const [g] of GROUPS){ const it = (S.settings.checklist[g] || []).find(x => x.id === id); if (it) return Object.assign({ g }, it); }
  return null;
}
function groupComplete(m, g){ const items = skillItems(m, g); return items.length > 0 && items.every(it => (m.skills[it.id]?.lvl || 0) === 3); }
function canAdmit(m, g){ return g !== 'common' && groupComplete(m, g) && groupComplete(m, 'common') && !m.admissions[g]; }
function lastSurvey(m){
  for (const k of [...MEET].reverse()){ const mt = m.meetings[k]; if (mt && mt.done && mt.answers && Object.values(mt.answers).some(Boolean)) return { k, a: mt.answers }; }
  return null;
}
/* Риск ухода: только прозрачные правила, чтобы наставник видел причину */
function riskReasons(m){
  if (m.status !== 'active') return [];
  const r = [], ns = sortedNotes(m);
  if (ns.length >= 2 && !ns[0].present && !ns[1].present) r.push('2 невыхода подряд');
  else if (ns.slice(0, 5).filter(n => !n.present).length >= 2) r.push('частые невыходы');
  const scored = ns.filter(n => n.present && n.score);
  if (scored.length >= 2 && scored[0].score <= 2 && scored[1].score <= 2) r.push('две слабые смены подряд');
  if (ns.slice(0, 3).some(n => (n.tags || []).some(t => LOAD_TAGS.includes(t)))) r.push('жалобы на нагрузку или самочувствие');
  if (ns.slice(0, 3).some(n => (n.tags || []).includes('Конфликтует с коллегами'))) r.push('конфликт с коллегами');
  if (ns.slice(0, 5).some(n => (n.tags || []).includes('Отсутствовал без предупреждения'))) r.push('не вышел без предупреждения');
  if (openHelp(m).some(n => n.helpReason === 'leave')) r.push('наставник видит риск ухода');
  const s = lastSurvey(m);
  if (s){
    if (s.a.stay && s.a.stay <= 2) r.push('не уверен, что останется');
    const v = avg(Object.values(s.a).filter(Boolean));
    if (v !== null && v <= 2.5) r.push('низкие ответы в беседе');
  }
  const k = nextMeeting(m);
  if (k !== null && worked(m) >= k + 2) r.push(`беседа ${k}-й смены просрочена`);
  return r;
}
function nextTask(m){
  const ln = lastNote(m);
  if (!ln || (!ln.nextSkill && !ln.nextText)) return null;
  const it = ln.nextSkill ? findSkill(ln.nextSkill) : null;
  if (it && (m.skills[it.id]?.lvl || 0) === 3 && !ln.nextText) return null;
  return { name: it ? it.name : '', text: ln.nextText || '' };
}
function taskHtml(m){
  const t = nextTask(m); if (!t || m.status !== 'active') return '';
  return `<div class="task">📌 На следующей смене: <b>${esc([t.name, t.text].filter(Boolean).join('. '))}</b></div>`;
}
function riskHtml(m){
  const r = riskReasons(m); if (!r.length) return '';
  return `<div class="risk"><b>Риск ухода</b>${esc(r.join(', '))}</div>`;
}

/* ---------- состояние экрана ---------- */

let sheet = null;   // контекст открытого листа

function go(view, id){ ui.view = view; if (id !== undefined) ui.id = id; if (view === 'mentee' && id !== undefined) ui.tab = 'shifts'; render(); window.scrollTo(0,0); }

function render(){

function ladderHtml(m){
  const w = worked(m);
  let cells = '';
  for (let i = 1; i <= 14; i++){
    const isM = MEET.includes(i);
    cells += `<i class="${i <= w ? 'f' : ''} ${isM ? 'm' : ''} ${isM && meetDone(m, i) ? 'done' : ''}" title="Смена ${i}${isM ? ', беседа' : ''}"></i>`;
  }
  return `<div class="ladder" aria-label="Отработано смен: ${w}">${cells}</div>
    <div class="ladcap"><span>${esc(stageOf(w))}</span><span>${w > 14 ? `+${w-14} после 14-й` : 'беседы на 3, 7 и 14 смене'}</span></div>`;
}

function flagsHtml(m){
  const f = [];
  const help = openHelp(m).length;
  if (help) f.push(`<span class="chip bad">🚨 ${esc(helpTitle(openHelp(m)[0]))}</span>`);
  const due = meetingDue(m);
  if (due) f.push(`<span class="chip warn">Пора провести беседу ${due}-й смены</span>`);
  const ln = lastNote(m);
  if (ln && !ln.present) f.push(`<span class="chip warn">Не вышел ${fmt(ln.date)}</span>`);
  if (m.status === 'active' && (!ln || ln.date < shiftDefaultDate())) f.push(`<span class="chip">Нет отметки за ${fmt(shiftDefaultDate()).slice(0,5)}</span>`);
  for (const [g] of WORK_GROUPS){
    const a = m.admissions[g];
    if (a && a.status === 'requested') f.push(`<span class="chip info">Допуск: ${esc(GNAME[g])}, ждёт подтверждения</span>`);
    else if (m.status === 'active' && canAdmit(m, g) && m.groups.includes(g)) f.push(`<span class="chip ok">Можно оформить допуск: ${esc(GNAME[g])}</span>`);
  }
  if (m.updatedAt > S.lastSentAt) f.push(`<span class="chip info">Не отправлено</span>`);
  return f.length ? `<div class="chips">${f.join('')}</div>` : '';
}

function menteeCard(m){
  const w = worked(m), p = progress(m);
  return `<div class="card tap" data-act="open" data-id="${m.id}">
    <div class="chead">
      <div><div class="nm">${esc(m.fio || 'Без имени')}</div>
        <div class="sub">${m.tab ? 'Таб. ' + esc(m.tab) + ', ' : ''}${esc(GNAME[m.mainGroup] || '')}</div></div>
      <div class="num"><b>${w}</b><span>${plural(w,'смена','смены','смен')}</span></div>
    </div>
    ${ladderHtml(m)}
    <div class="barrow"><span>Навыки</span><div class="bar"><span style="width:${p}%"></span></div><span>${p}%</span></div>
    ${riskHtml(m)}
    ${flagsHtml(m)}
    ${taskHtml(m)}
    <div class="cact"><button class="btn main" data-act="noteNew" data-id="${m.id}">Отметить смену</button></div>
  </div>`;
}

function viewList(){
  let h = '';
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (!standalone && !S.settings.installHidden){
    const ios = /iP(hone|ad|od)/.test(navigator.userAgent);
    h += `<div class="note"><b>Добавьте на главный экран</b>
      ${ios ? 'В Safari нажмите «Поделиться» ⬆️, затем «На экран „Домой“».' : 'В меню браузера ⋮ выберите «Добавить на главный экран».'}
      Так приложение будет открываться одним касанием и работать без интернета, а iPhone не сотрёт ваши записи.
      <div class="row"><button class="btn sm ghost" data-act="hideInstall">Уже добавил</button></div></div>`;
  }
  if (!S.settings.fio){
    h += `<div class="note"><b>Начните с ваших данных</b>Укажите ФИО и смену — они попадут в отчёт руководителю.
      <div class="row"><button class="btn sm" data-act="go" data-v="settings">Заполнить</button></div></div>`;
  }
  const act = S.mentees.filter(m => m.status === 'active');
  const rank = m => (openHelp(m).length ? 0 : riskReasons(m).length ? 1 : meetingDue(m) ? 2 : 3);
  act.sort((a, b) => rank(a) - rank(b) || a.fio.localeCompare(b.fio, 'ru'));
  if (!act.length){
    h += `<div class="empty"><div class="big">🦺</div><p>Пока нет новичков. Добавьте того, кого вам закрепили, или загрузите задание от руководителя смены.</p>
      <div class="row"><button class="btn main" data-act="menteeNew">Добавить новичка</button></div>
      <div class="row" style="margin-top:10px"><button class="btn" data-act="import">Загрузить файл</button></div></div>`;
  } else {
    if (act.length >= 2) h += `<div class="row" style="margin-bottom:12px"><button class="btn dark" data-act="batch">✔️ Отметить смену всем (${act.length})</button></div>`;
    h += act.map(menteeCard).join('');
    h += `<div class="row"><button class="btn" data-act="menteeNew">＋ Добавить новичка</button></div>`;
  }
  const arch = S.mentees.filter(m => m.status !== 'active');
  if (arch.length){
    h += `<details class="arch"><summary>Завершили и уволились (${arch.length})</summary>
      ${arch.map(m => `<div class="card tap" data-act="open" data-id="${m.id}"><div class="chead"><div><div class="nm">${esc(m.fio)}</div>
      <div class="sub">${m.status === 'done' ? 'Завершил адаптацию' : 'Уволился'} ${fmt(m.statusDate)}${m.statusReason ? ', ' + esc(m.statusReason) : ''}</div></div>
      <div class="num"><b>${worked(m)}</b><span>смен</span></div></div></div>`).join('')}</details>`;
  }
  h += `<div class="sign">${esc(SIGN)}</div>`;
  return h;
}

function viewMentee(m){
  const tabs = [['shifts','Смены'],['skills','Навыки'],['meet','Беседы'],['data','Данные']];
  let h = `<div class="card">
    <div class="chead"><div><div class="nm">${esc(m.fio)}</div>
      <div class="sub">${m.tab ? 'Таб. ' + esc(m.tab) + ', ' : ''}принят ${fmt(m.hireDate)}</div>
      <div class="sub">${esc(GNAME[m.mainGroup])}${m.groups.length > 1 ? ' + ' + m.groups.filter(g => g !== m.mainGroup).map(g => GNAME[g]).join(', ') : ''}</div></div>
      <div class="num"><b>${worked(m)}</b><span>${plural(worked(m),'смена','смены','смен')}</span></div></div>
    ${ladderHtml(m)}
    ${m.status !== 'active' ? `<div class="chips"><span class="chip ${m.status==='done'?'ok':'bad'}">${m.status==='done'?'Завершил адаптацию':'Уволился'} ${fmt(m.statusDate)}</span></div>` : riskHtml(m) + flagsHtml(m) + taskHtml(m)}
  </div>
  <div class="tabs" role="tablist">${tabs.map(([k, t]) => `<button role="tab" data-act="tab" data-v="${k}" class="${ui.tab===k?'on':''}">${t}</button>`).join('')}</div>`;

  if (ui.tab === 'skills') h += tabSkills(m);
  else if (ui.tab === 'meet') h += tabMeet(m);
  else if (ui.tab === 'data') h += tabData(m);
  else h += tabShifts(m);
  return h;
}

function tabShifts(m){
  let h = m.status === 'active' ? `<div class="row" style="margin-bottom:14px"><button class="btn main" data-act="noteNew" data-id="${m.id}">Отметить смену</button></div>` : '';
  const ns = sortedNotes(m);
  if (!ns.length) return h + `<div class="empty"><p>Отметок пока нет. После каждой смены нажмите «Отметить смену» — это занимает полминуты.</p></div>`;
  if (m.shiftsBefore) h += `<p class="muted small">До начала записей отработал смен: ${m.shiftsBefore}</p>`;
  for (const n of ns){
    const [y, mo, d] = n.date.split('-');
    h += `<div class="card tap" data-act="noteEdit" data-id="${m.id}" data-n="${n.id}"><div class="hist">
      <div class="dt"><b>${+d}</b><span>${MON[+mo-1]}</span></div>
      <div class="bd">
        <div>${n.present ? `<b>${SCORE_IC[n.score] || ''} ${SCORE[n.score] || 'Без оценки'}</b>` : '<b>Не вышел на смену</b>'}</div>
        ${n.tags && n.tags.length ? `<div class="chips">${n.tags.map(t => `<span class="chip ${tagChipCls(t)}">${tagSign(t) > 0 ? '✓ ' : tagSign(t) < 0 ? '⚠ ' : ''}${esc(t)}</span>`).join('')}</div>` : ''}
        ${n.comment ? `<p>${esc(n.comment)}</p>` : ''}
        ${n.nextSkill || n.nextText ? `<p class="small muted">📌 ${esc([findSkill(n.nextSkill)?.name, n.nextText].filter(Boolean).join('. '))}</p>` : ''}
        ${n.help ? `<div class="chips"><span class="chip ${n.helpResolved ? 'ok' : 'bad'}">${n.helpResolved ? 'Помощь: вопрос решён' : '🚨 ' + helpTitle(n)}</span></div>
          ${n.helpText ? `<p class="small muted">${esc(n.helpText)}</p>` : ''}
          ${!n.helpResolved ? `<div class="row" style="margin-top:8px"><button class="btn sm" data-act="helpResolve" data-id="${m.id}" data-n="${n.id}">Вопрос решён</button></div>` : ''}` : ''}
      </div></div></div>`;

}

function tabSkills(m){
  let h = `<p class="muted small" style="margin-top:0">Отмечайте, как идёт обучение: показали операцию, новичок делает её под вашим контролем, или он допущен работать сам.</p>`;
  for (const g of groupsOf(m)){
    const items = skillItems(m, g);
    if (!items.length) continue;
    h += `<div class="card"><div class="ghead"><b>${esc(GNAME[g])}</b><span class="muted small">${progress(m, g)}%</span></div>`;
    for (const it of items){
      const s = m.skills[it.id] || { lvl: 0 };
      const lvl = s.lvl || 0;
      const when = lvl && s.dates && s.dates[lvl] ? `${LEVELS[lvl]}: ${fmt(s.dates[lvl])}` : '';
      h += `<div class="skill"><div class="sn">${esc(it.name)}</div>
        <div class="seg">${LEVELS_SHORT.map((t, i) => `<button class="l${i} ${lvl===i?'on':''}" data-act="lvl" data-id="${m.id}" data-s="${it.id}" data-l="${i}" ${m.status!=='active'?'disabled':''}>${t}</button>`).join('')}</div>
        ${when ? `<div class="sd">${when}</div>` : ''}</div>`;
    }
    if (g !== 'common') h += admissionBlock(m, g);
    h += `</div>`;
  }
  return h;
}

function admissionBlock(m, g){
  const a = m.admissions[g];
  if (a && a.status === 'confirmed') return `<div class="adm"><span class="chip ok">Допуск подтверждён руководителем ${fmt(a.confirmedDate)}</span></div>`;
  if (a && a.status === 'requested') return `<div class="adm"><div class="chips" style="margin-top:0"><span class="chip info">Лист допуска оформлен ${fmt(a.date)}, ждёт подтверждения</span></div>
    <div class="row"><button class="btn sm" data-act="admShare" data-id="${m.id}" data-g="${g}">Отправить лист</button><button class="btn sm" data-act="admConfirm" data-id="${m.id}" data-g="${g}">Руководитель подтвердил</button></div>
    <div class="row"><button class="btn sm ghost" data-act="admCancel" data-id="${m.id}" data-g="${g}">Отменить лист допуска</button></div></div>`;
  if (m.status !== 'active') return '';
  if (canAdmit(m, g)) return `<div class="adm"><div class="row" style="margin-top:0"><button class="btn main" data-act="admit" data-id="${m.id}" data-g="${g}">Оформить лист допуска</button></div></div>`;
  if (groupComplete(m, g)) return `<div class="adm small muted">Все пункты освоены. Чтобы оформить допуск, закройте также группу «Общее».</div>`;
  return '';
}
function admissionText(m, g){
  const a = m.admissions[g] || {};
  const lines = [`ЛИСТ ДОПУСКА К САМОСТОЯТЕЛЬНОЙ РАБОТЕ`, ``,
    `Сотрудник: ${m.fio}${m.tab ? ', таб. ' + m.tab : ''}`, `Принят: ${fmt(m.hireDate)}`, `Операции: ${GNAME[g]}`,
    `Отработано смен: ${shiftNoAt(m, a.date || today())}`, ``, `Освоено:`];
  for (const gg of ['common', g]) for (const it of skillItems(m, gg)){
    const s = m.skills[it.id] || {}; lines.push(`• ${it.name} — допущен ${fmt(s.dates && s.dates[3])}`);
  }
  lines.push('', `Наставник: ${S.settings.fio || '—'}${S.settings.shift ? ', смена ' + S.settings.shift : ''}`, `Дата: ${fmt(a.date || today())}`);
  if (a.comment) lines.push(`Комментарий: ${a.comment}`);
  lines.push('', 'Наставник считает сотрудника готовым к самостоятельной работе. Решение о допуске принимает руководитель смены.');
  return lines.join('\n');
}
async function shareText(t, okMsg){
  if (navigator.share){ try { await navigator.share({ text: t }); return; } catch(e){ if (e && e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(t); toast(okMsg || 'Текст скопирован — вставьте его в чат'); }
  catch(e){ const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('Текст скопирован'); }
}

function tabMeet(m){
  const w = worked(m);
  let h = `<p class="muted small" style="margin-top:0">Короткие беседы один на один: как дела, что получается, что мешает. Итоги увидит руководитель смены.</p>`;
  for (const k of MEET){
    const mt = m.meetings[k];
    let st;
    if (mt && mt.done) st = `<span class="chip ok">Проведена ${fmt(mt.date)}</span>`;
    else if (w >= k) st = `<span class="chip warn">Пора провести</span>`;
    else st = `<span class="chip">Через ${k - w} ${plural(k - w,'смену','смены','смен')}</span>`;
    const ans = mt && mt.answers ? SURVEY.filter(([id]) => mt.answers[id]).map(([id, q]) => `<div class="ans"><span>${esc(q)}</span><b class="${mt.answers[id] <= 2 ? 'low' : ''}">${SURVEY_SCALE[mt.answers[id]]}</b></div>`).join('') : '';
    h += `<div class="card"><div class="ghead"><b>Беседа на ${k}-й смене</b></div><div class="chips">${st}</div>
      ${ans ? `<div style="margin-top:10px">${ans}</div>` : ''}
      ${mt && mt.comment ? `<p style="white-space:pre-wrap;margin:10px 0 0">${esc(mt.comment)}</p>` : ''}
      ${m.status === 'active' || (mt && mt.done) ? `<div class="row" style="margin-top:12px"><button class="btn sm ${mt && mt.done ? '' : 'main'}" data-act="meet" data-id="${m.id}" data-k="${k}">${mt && mt.done ? 'Изменить итоги' : 'Записать итоги'}</button></div>` : ''}
    </div>`;
  }
  return h;
}

function groupPickers(sel, main){
  if (WORK_GROUPS.length === 1) return `<input type="hidden" name="mainGroup" value="${WORK_GROUPS[0][0]}">`;
  return `<label class="f"><span>Основная группа операций</span><select name="mainGroup">${WORK_GROUPS.map(([g, n]) => `<option value="${g}" ${main===g?'selected':''}>${n}</option>`).join('')}</select></label>
  <div class="f"><span class="muted small" style="display:block;margin-bottom:6px">Ещё обучается (необязательно)</span>
  ${WORK_GROUPS.map(([g, n]) => `<label class="check"><input type="checkbox" name="g_${g}" ${sel.includes(g) && g !== main ? 'checked' : ''}><span>${n}</span></label>`).join('')}</div>`;
}

function menteeForm(m){

  return `<label class="f"><span>ФИО</span><input type="text" name="fio" value="${esc(m.fio)}" autocomplete="off" autocapitalize="words"></label>

function tabData(m){
  let h = `<div class="card"><form id="mform" onsubmit="return false">${menteeForm(m)}

      <button class="btn" data-act="status" data-id="${m.id}" data-v="left">🚪 Уволился</button></div>`;
  } else {

      <dt>Дата</dt><dd>${fmt(m.statusDate)}</dd>${m.statusReason ? `<dt>Причина</dt><dd>${esc(m.statusReason)}</dd>` : ''}
      ${m.statusComment ? `<dt>Комментарий</dt><dd>${esc(m.statusComment)}</dd>` : ''}</dl></div>
      <div class="row"><button class="btn" data-act="reactivate" data-id="${m.id}">Вернуть в работу</button></div>`;

function viewStats(){
  const all = S.mentees;
  if (!all.length) return `<div class="empty"><div class="big">📊</div><p>Итоги появятся, когда вы добавите новичков и начнёте отмечать смены.</p></div>`;
  const act = all.filter(m => m.status === 'active'), done = all.filter(m => m.status === 'done'), left = all.filter(m => m.status === 'left');
  const reached = all.filter(m => worked(m) >= 14 || m.status === 'done').length;
  const lostEarly = left.filter(m => worked(m) < 14).length;
  const base = reached + lostEarly;
  const ret = base ? Math.round(reached / base * 100) : null;
  let h = `<div class="stats">
    <div class="stat"><b>${all.length}</b><span>всего новичков</span></div>
    <div class="stat"><b>${act.length}</b><span>сейчас обучаются</span></div>
    <div class="stat"><b>${done.length}</b><span>завершили адаптацию</span></div>
    <div class="stat"><b>${left.length}</b><span>уволились</span></div>
    <div class="stat wide"><b>${ret === null ? '—' : ret + '%'}</b><span>${base ? `удержание до 14-й смены: ${reached} из ${base}` : 'удержание до 14-й смены — пока никто не дошёл до итога'}${base && base < 5 ? '. Данных пока мало, цифра неточная' : ''}</span></div>
  </div>`;

  // Допуски
  const adm = [];
  for (const m of all) for (const [g] of WORK_GROUPS){ const a = m.admissions[g]; if (a) adm.push({ g, n: shiftNoAt(m, a.date), st: a.status }); }
  h += `<h2>Допуски</h2><div class="card">`;
  if (!adm.length) h += `<p class="muted small" style="margin:0">Листов допуска пока нет.</p>`;
  else {
    h += `<dl class="kv"><dt>Оформлено листов</dt><dd>${adm.length}</dd><dt>Подтверждено</dt><dd>${adm.filter(a => a.st === 'confirmed').length}</dd></dl>`;
    for (const [g, name] of WORK_GROUPS){
      const xs = adm.filter(a => a.g === g); if (!xs.length) continue;
      h += `<div class="ans"><span>${esc(name)}: в среднем к смене</span><b>${Math.round(avg(xs.map(a => a.n)))}</b></div>`;
    }
  }
  h += `</div>`;

  // Беседы
  let due = 0, held = 0, onTime = 0, checkable = 0;
  for (const m of all){
    const first = m.notes.map(n => n.date).sort()[0];
    for (const k of MEET){
      if (worked(m) < k) continue; due++;
      const mt = m.meetings[k]; if (!mt || !mt.done) continue; held++;
      // если смены до начала записей не датированы, номер смены на дату беседы неизвестен
      if (m.shiftsBefore && (!first || mt.date < first)) continue;
      checkable++; if (shiftNoAt(m, mt.date) <= k + 1) onTime++;
    }
  }
  h += `<h2>Беседы</h2><div class="card"><dl class="kv"><dt>Положено провести</dt><dd>${due}</dd><dt>Проведено</dt><dd>${held}</dd>
    <dt>Вовремя</dt><dd>${checkable ? `${onTime} из ${checkable}` : '—'}</dd></dl>
    <p class="small muted" style="margin:8px 0 0">«Вовремя» — не позже следующей смены после положенной. Считается только по беседам, для которых есть отметки смен.</p></div>`;

  // Ответы новичков
  const qs = SURVEY.map(([id, q]) => { const v = []; for (const m of all) for (const k of MEET){ const a = m.meetings[k]?.answers?.[id]; if (a) v.push(a); } return { q, v }; });
  if (qs.some(x => x.v.length)){
    h += `<h2>Что говорят новички</h2><div class="card"><p class="small muted" style="margin:0 0 4px">Средний ответ по всем беседам, из 5.</p>`;
    for (const { q, v } of qs){
      if (!v.length) continue; const a = avg(v);
      h += `<div class="hbar"><div class="lbl"><span>${esc(q)}</span><b>${a.toFixed(1)}</b></div><div class="bar"><span class="${a < 3 ? 'b' : a < 4 ? 'w' : ''}" style="width:${a / 5 * 100}%"></span></div></div>`;
    }
    h += `</div>`;
  }

  // Смены за 30 дней
  const from = isoLocal(Date.now() - 30 * 864e5);
  const ns = all.flatMap(m => m.notes.filter(n => n.date >= from));
  const sc = ns.filter(n => n.present && n.score).map(n => n.score);
  h += `<h2>Последние 30 дней</h2><div class="card"><dl class="kv"><dt>Отметок о сменах</dt><dd>${ns.length}</dd>
    <dt>Невыходов</dt><dd>${ns.filter(n => !n.present).length}</dd><dt>Средняя оценка смены</dt><dd>${sc.length ? avg(sc).toFixed(1) + ' из 5' : '—'}</dd></dl></div>`;

  // Увольнения
  if (left.length){
    const reasons = {}; left.forEach(m => { const r = m.statusReason || 'Не указана'; reasons[r] = (reasons[r] || 0) + 1; });
    h += `<h2>Увольнения</h2><div class="card"><dl class="kv"><dt>В среднем на смене</dt><dd>${Math.round(avg(left.map(worked)))}</dd></dl><div style="margin-top:8px">
      ${Object.entries(reasons).sort((a, b) => b[1] - a[1]).map(([r, c]) => `<div class="ans"><span>${esc(r)}</span><b>${c}</b></div>`).join('')}</div></div>`;
  }
  h += `<div class="sign">${esc(SIGN)}</div>`;
  return h;
}

/* ---------- нижний лист ---------- */
function openSheet(html, ctx){ sheet = ctx || {}; $('#pane').innerHTML = `<div class="grip"></div>${html}`; $('#sheet').classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeSheet(){ if (sheet && sheet.rec){ try { sheet.rec.stop(); } catch(e) {} } sheet = null; $('#sheet').classList.remove('open'); document.body.style.overflow = ''; }

    </div>
    <div class="f"><span class="muted small" style="display:block;margin-bottom:6px">Что заметили <span id="nTagCap"></span></span><div id="nTags"></div></div>

    <label class="f"><input type="text" id="nNextText" value="${esc(n.nextText || '')}" placeholder="или своими словами"></label>

/* Номер смены, к которой относится отметка: смены до записей + отмеченные выходы раньше этой даты + эта */
function noteShiftNo(m, n, date){
  return (+m.shiftsBefore || 0) + m.notes.filter(x => x.present && x.id !== n.id && x.date < date).length + 1;
}
function tagAllowed(d, no){ return no >= (TAG_GROUP_MIN[d.g] || 0); }
function tagChip(d, n, more){
  const on = n.tags.includes(d.t), full = !on && n.tags.length >= MAX_TAGS;
  const cls = d.s > 0 ? 'pos' : d.s < 0 ? 'neg' : 'neu';
  return `<button data-act="nTag" data-v="${esc(d.t)}" class="tg ${cls} ${on ? 'on' : ''}" ${full ? 'aria-disabled="true"' : ''} aria-pressed="${on}">${d.s > 0 ? '✓ ' : d.s < 0 ? '⚠ ' : ''}${esc(d.t)}${more && d.hint ? `<small>${esc(d.hint)}</small>` : ''}</button>`;
}
function refreshNoteTags(){
  if (!sheet || sheet.kind !== 'note') return;
  const m = findM(sheet.mid), n = sheet.note, date = $('#nDate').value || n.date;
  const no = noteShiftNo(m, n, date);
  sheet.shiftNo = no;
  const cap = $('#nShiftCap'); if (cap) cap.textContent = `Как прошла ${no}-я смена`;
  const box = $('#nTags'); if (!box) return;
  $('#nTagCap').textContent = `${n.tags.length}/${MAX_TAGS}`;
  if (!n.present){
    box.innerHTML = `<div class="tagset">${TAG_DEFS.filter(d => d.absent).map(d => tagChip(d, n, false)).join('')}</div>`;
    return;
  }
  const core = TAG_DEFS.filter(d => d.core && !d.absent && tagAllowed(d, no));
  const known = new Set(core.map(d => d.t));
  let h = `<div class="tagset">${core.map(d => tagChip(d, n, false)).join('')}`;
  if (!sheet.more) h += n.tags.filter(t => !known.has(t)).map(t => tagChip(TAG_MAP[t] || { t, s: 0 }, n, false)).join('');
  h += `</div>`;
  if (sheet.more){
    for (const [g, label, min] of TAG_GROUPS){
      const defs = TAG_DEFS.filter(d => d.g === g && !d.core && !d.absent);
      if (!defs.length) continue;
      if (no < min){ h += `<div class="tgh">${esc(label)} <span class="muted">— с ${min}-й смены</span></div>`; continue; }
      h += `<div class="tgh">${esc(label)}</div><div class="tagset">${defs.map(d => tagChip(d, n, true)).join('')}</div>`;
    }
    const legacy = n.tags.filter(t => !TAG_MAP[t]);
    if (legacy.length) h += `<div class="tagset" style="margin-top:10px">${legacy.map(t => tagChip({ t, s: 0 }, n, false)).join('')}</div>`;
  }
  h += `<div class="tgfoot"><button class="linkbtn" data-act="nMore">${sheet.more ? 'Свернуть' : 'Ещё…'}</button><span class="muted small">не больше ${MAX_TAGS} — главное за смену</span></div>`;
  box.innerHTML = h;
}
function renderPhrases(){
  const box = $('#nPhrases'); if (!box || !sheet) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  box.innerHTML = (sheet.note.present ? PHRASES.map((p, i) => `<button data-act="nPhrase" data-v="${i}">${p[0]}</button>`).join('') : '') +
    `<button data-act="nVoice" id="nVoice" class="${sheet.rec ? 'rec' : ''}">${sheet.rec ? '🔴 Слушаю… стоп' : '🗣️ Голос'}</button>`;
}
function growComment(){
  const ta = $('#nComment'); if (!ta) return;
  ta.style.height = 'auto'; ta.style.height = Math.max(48, ta.scrollHeight + 2) + 'px';
  const c = $('#nCnt'); if (c) c.textContent = ta.value.length;
}
function appendComment(text){
  const ta = $('#nComment'); if (!ta || !text) return;
  const cur = ta.value.trim();
  if (cur.includes(text)) return;
  const next = (cur ? cur + ' ' : '') + text;
  if (next.length > COMMENT_MAX){ toast(`Комментарий не длиннее ${COMMENT_MAX} знаков`); return; }
  ta.value = next; growComment();
}
function helpBlockHtml(prefix, on, reason, text){
  return `<button type="button" class="helpbar ${on ? 'on' : ''} ${prefix === 'n' ? '' : 'sm'}" id="${prefix}HelpBar" data-act="helpBar" data-p="${prefix}" aria-pressed="${!!on}">
      <span class="hic">${on ? '🚨' : '🔕'}</span><span><b>Нужна помощь руководителя</b>${prefix === 'n' ? `<small>${on ? 'Руководитель увидит это первым' : 'Нажмите, если без руководителя не обойтись'}</small>` : ''}</span></button>
    <div id="${prefix}HelpWrap" ${on ? '' : 'hidden'}>
      <div class="pick c2 reasons" id="${prefix}Reasons">${HELP_REASONS.map(([k, l]) => `<button data-act="helpReason" data-p="${prefix}" data-v="${k}" class="${reason === k ? 'on' : ''}">${l}</button>`).join('')}</div>
      <input type="text" id="${prefix}HelpText" maxlength="${COMMENT_MAX}" value="${esc(text || '')}" placeholder="${reason === 'other' ? 'Что случилось — коротко' : 'Уточнение (необязательно)'}" ${reason === 'other' || text ? '' : 'hidden'}>
      ${reason === 'other' || text ? '' : `<button class="linkbtn" data-act="helpMore" data-p="${prefix}" id="${prefix}HelpMore">+ уточнить</button>`}
    </div>`;

/* Короткий сигнал, что тревога включена: вибрация (Android) и «дзынь» */
function helpSignal(){
  try { if (navigator.vibrate) navigator.vibrate(50); } catch(e) {}
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ctx = helpSignal.ctx || (helpSignal.ctx = new AC());
    if (ctx.state === 'suspended') ctx.resume();
    const o = ctx.createOscillator(), g = ctx.createGain(), t0 = ctx.currentTime;
    o.type = 'sine'; o.frequency.setValueAtTime(1046, t0);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
    o.connect(g); g.connect(ctx.destination); o.start(t0); o.stop(t0 + 0.36);
  } catch(e) {}
}
function helpState(prefix){
  if (!sheet) return null;
  if (prefix === 'n') return sheet.help;
  const id = prefix.slice(2); return sheet.items && sheet.items[id] ? sheet.items[id].helpSt : null;
}

function readForm(form){

}
function validMentee(d, selfId){
  if (!d.fio) return 'Укажите ФИО';
  if (d.hireDate && d.hireDate > today()) return 'Дата приёма не может быть в будущем';

  return '';
}

/* ---------- обмен файлами ---------- */
function reportPayload(list, full){
  return {
    format: 'pasport-mentor-report', version: 1, app: 'Карманный наставник ' + APP_VERSION,
    createdAt: new Date().toISOString(), full: !!full, since: full ? null : (S.lastSentAt ? new Date(S.lastSentAt).toISOString() : null),
    division: S.settings.division, leader: S.settings.leader,
    mentor: { fio: S.settings.fio, tab: S.settings.tab, shift: S.settings.shift },
    checklist: S.settings.checklist,
    mentees: list.map(m => Object.assign(JSON.parse(JSON.stringify(m)), {
      calc: { shiftsWorked: worked(m), stage: stageOf(worked(m)), progress: progress(m), levels: countLevels(m), meetingDue: meetingDue(m), openHelp: openHelp(m).length, risk: riskReasons(m), nextTask: nextTask(m) }
    }))
  };
}
function download(name, text, type){
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
async function shareFile(name, obj, title){
  const text = JSON.stringify(obj);
  let file = null;
  try { file = new File([text], name, { type: 'application/json' }); } catch(e) {}
  if (file && navigator.canShare && navigator.canShare({ files: [file] })){
    try { await navigator.share({ files: [file], title }); return 'shared'; }
    catch(e){ if (e && e.name === 'AbortError') return 'cancel'; }
  }
  download(name, text, 'application/json');
  return 'downloaded';
}
function safeName(s){ return String(s || 'наставник').replace(/[\\/:*?"<>|]+/g, '').replace(/\s+/g, '_').slice(0, 40); }

async function sendReport(full){
  if (!S.settings.fio){ toast('Сначала укажите своё ФИО в настройках'); go('settings'); return; }
  const list = full ? S.mentees : unsent();
  if (!list.length){ toast('Нет изменений для отправки'); return; }
  const startedAt = Date.now();
  const name = `наставник_${safeName(shortFio(S.settings.fio))}_${fileStamp()}.json`;
  const res = await shareFile(name, reportPayload(list, full), 'Отчёт наставника');
  if (res === 'cancel') return;
  if (res === 'downloaded' && !confirm('Файл сохранён в «Загрузки». Отправьте его руководителю смены.\n\nОтметить изменения как отправленные?')) return;
  S.lastSentAt = startedAt; S.sentLog.push({ ts: startedAt, count: list.length, full: !!full });
  S.sentLog = S.sentLog.slice(-30); save(); render(); toast('Отчёт отправлен');
}

function textSummary(){
  const st = S.settings;
  const lines = [`Отчёт наставника: ${st.fio || '—'}${st.shift ? ', смена ' + st.shift : ''}, ${fmt(shiftDefaultDate())}`];
  for (const m of S.mentees.filter(x => x.status === 'active')){
    const w = worked(m), ln = lastNote(m), c = countLevels(m);
    let s = `\n• ${shortFio(m.fio)} — ${w} ${plural(w,'смена','смены','смен')} (${stageOf(w).toLowerCase()}), навыки ${progress(m)}%: допущен ${c[3]}, под контролем ${c[2]}`;
    if (ln){
      s += `\n  ${fmt(ln.date)}: ${ln.present ? (SCORE[ln.score] ? SCORE[ln.score].toLowerCase() : 'без оценки') : 'не вышел'}`;
      if (ln.tags && ln.tags.length) s += '; ' + ln.tags.join(', ').toLowerCase();
      if (ln.comment) s += '. ' + ln.comment;
    }
    const nt = nextTask(m); if (nt) s += `\n  📌 Дальше: ${[nt.name, nt.text].filter(Boolean).join('. ')}`;
    const rr = riskReasons(m); if (rr.length) s += `\n  🔻 Риск ухода: ${rr.join(', ')}`;
    for (const [g] of WORK_GROUPS) if (m.admissions[g] && m.admissions[g].status === 'requested') s += `\n  ✅ Готов к допуску: ${GNAME[g]} (лист от ${fmt(m.admissions[g].date)})`;
    for (const h of openHelp(m)) s += `\n  🚨 ${helpTitle(h)} (${fmt(h.date)})${h.helpText ? ': ' + h.helpText : ''}`;
    const d = meetingDue(m); if (d) s += `\n  ⏰ Пора провести беседу ${d}-й смены`;
    lines.push(s);
  }
  if (lines.length === 1) lines.push('\nАктивных новичков нет.');
  return lines.join('\n');
}
function sendText(){ return shareText(textSummary()); }

/* Отчёт кодом: тот же отчёт, сжатый и записанный текстом — для почты или если файлы не доходят до рабочего ПК */
async function reportCode(list){
  let bytes = new TextEncoder().encode(JSON.stringify(reportPayload(list, false))), prefix = 'НАСТАВНИК1:';
  if (typeof CompressionStream !== 'undefined'){
    try { const r = new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'))); bytes = new Uint8Array(await r.arrayBuffer()); prefix = 'НАСТАВНИК1Z:'; } catch(e) {}
  }
  let bin = ''; for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  return prefix + btoa(bin);
}
async function sendCode(){
  if (!S.settings.fio){ toast('Сначала укажите своё ФИО в настройках'); go('settings'); return; }
  const list = unsent();
  if (!list.length){ toast('Нет изменений для отправки'); return; }
  const startedAt = Date.now(), code = await reportCode(list);
  openSheet(`<h3>Отчёт кодом</h3><p class="lead">${list.length} ${plural(list.length,'новичок','новичка','новичков')}, ${code.length} знаков</p>
    ${code.length > 4000 ? `<div class="note" style="border-left-color:var(--warn)">Код длинный: Telegram и WhatsApp разобьют его на несколько сообщений, и он не загрузится. Отправьте его по почте или кнопкой «Отправить отчёт за смену» (файлом).</div>` : ''}
    <textarea readonly style="min-height:120px;font-family:monospace;font-size:12px" onclick="this.select()">${esc(code)}</textarea>
    <p class="small muted">Руководитель смены вставит этот текст в «Паспорте смены»: Данные → Отчёты наставников → «Загрузить из текста».</p>
    <div class="actions"><button class="btn" data-act="codeCopy">Скопировать</button><button class="btn main" data-act="codeShare">Поделиться</button></div>`,
    { kind: 'code', code, startedAt, count: list.length });
}
function markSent(startedAt, count){
  S.lastSentAt = startedAt; S.sentLog.push({ ts: startedAt, count }); S.sentLog = S.sentLog.slice(-30); save();
}

function mergeMentees(list){
  let added = 0, updated = 0;
  for (const raw of list){
    const inc = normMentee(Object.assign({}, raw)); delete inc.calc;
    const ex = S.mentees.find(x => x.id === inc.id) || (inc.tab && S.mentees.find(x => x.tab === inc.tab));
    if (!ex){ S.mentees.push(inc); added++; }
    else if (inc.updatedAt > ex.updatedAt){ Object.assign(ex, inc, { id: ex.id }); updated++; }
  }
  return { added, updated };
}
function importAssignment(d){
  let added = 0, skipped = 0;
  for (const r of (d.mentees || [])){
    const fio = String(r.fio || '').trim(); if (!fio){ skipped++; continue; }
    const tab = String(r.tab || '').trim();
    if (tab && S.mentees.some(x => x.tab === tab)){ skipped++; continue; }
    const main = GNAME[r.mainGroup] && r.mainGroup !== 'common' ? r.mainGroup : 'pick';
    S.mentees.push(normMentee({ id: uid(), fio, tab, hireDate: r.hireDate || '', mainGroup: main, groups: [main], shiftsBefore: +r.shiftsWorked || +r.shiftsBefore || 0 }));
    added++;
  }
  if (d.mentor && !S.settings.leader && d.leader) S.settings.leader = d.leader;
  return { added, skipped };
}
function handleFile(text){
  let d;
  try { d = JSON.parse(text); } catch(e){ d = null; }
  if (!d || typeof d !== 'object'){ alert('Это не файл наставника. Нужен файл .json из «Карманного наставника» или задание от руководителя смены.'); return; }
  if (d.format === 'pasport-mentor-backup'){
    if (!confirm(`Заменить все данные на телефоне копией от ${fmtTs(Date.parse(d.createdAt))}?\nНовичков в копии: ${(d.state?.mentees || []).length}`)) return;
    localStorage.setItem(KEY, JSON.stringify(d.state)); load(); save(); go('list'); toast('Копия восстановлена'); return;
  }
  if (d.format === 'pasport-mentor-report'){
    const r = mergeMentees(d.mentees || []); save(); go('list');
    toast(`Добавлено: ${r.added}, обновлено: ${r.updated}`); return;
  }
  if (d.format === 'pasport-mentor-assignment'){
    const r = importAssignment(d); save(); go('list');
    toast(`Новичков добавлено: ${r.added}${r.skipped ? ', пропущено (уже есть): ' + r.skipped : ''}`); return;
  }
  alert('Файл не распознан. Подходят: полная копия, отчёт наставника или задание от руководителя смены.');
}

/* ---------- действия ---------- */
const ACT = {
  go: d => go(d.v),
  open: d => go('mentee', d.id),
  tab: d => { ui.tab = d.v; render(); },
  hideInstall: () => { S.settings.installHidden = true; save(); render(); },
  closeSheet,

  batch: () => {
    const act = S.mentees.filter(m => m.status === 'active').sort((a, b) => a.fio.localeCompare(b.fio, 'ru'));
    const items = {}; act.forEach(m => items[m.id] = { present: true, score: 0, helpSt: { on: false, reason: '' } });
    const opts = GROUPS.map(([g, name]) => {

  batchSave: () => {
    const dt = $('#bDate').value;
    if (!dt){ toast('Укажите дату смены'); return; }
    if (dt > today()){ toast('Дата смены не может быть в будущем'); return; }
    const ms = sheet.ids.map(findM).filter(Boolean);
    const noReason = ms.filter(m => sheet.items[m.id].helpSt.on && !sheet.items[m.id].helpSt.reason);
    if (noReason.length){ toast(`Выберите причину помощи: ${noReason.map(m => shortFio(m.fio)).join(', ')}`); return; }
    const noText = ms.filter(m => sheet.items[m.id].helpSt.reason === 'other' && sheet.items[m.id].helpSt.on && !$('#b_' + m.id + 'HelpText').value.trim());
    if (noText.length){ toast(`Напишите, что случилось: ${noText.map(m => shortFio(m.fio)).join(', ')}`); return; }
    const early = ms.filter(m => m.hireDate && dt < m.hireDate);
    if (early.length){ toast(`Дата раньше даты приёма: ${early.map(m => shortFio(m.fio)).join(', ')}`); return; }
    const clash = ms.filter(m => m.notes.some(n => n.date === dt));
    if (clash.length && !confirm(`За ${fmt(dt)} уже есть отметки: ${clash.map(m => shortFio(m.fio)).join(', ')}. Заменить их?`)) return;
    const skill = $('#bSkill').value, lvl = sheet.lvl, next = $('#bNext').value;
    const sk = skill ? findSkill(skill) : null, nx = next ? findSkill(next) : null;
    let raised = 0;
    for (const m of ms){
      const it = sheet.items[m.id], help = it.helpSt.on, htxt = $('#b_' + m.id + 'HelpText').value.trim();
      const n = { id: uid(), date: dt, present: it.present, score: it.present ? it.score : 0, tags: [], comment: $('#bc_' + m.id).value.trim(),
                  help, helpReason: help ? it.helpSt.reason : '', helpText: help ? htxt : '', helpResolved: false, nextSkill: '', nextText: '', ts: Date.now() };
      if (nx && groupsOf(m).includes(nx.g) && (m.skills[nx.id]?.lvl || 0) < 3) n.nextSkill = nx.id;
      m.notes = m.notes.filter(x => x.date !== dt); m.notes.push(n);
      if (sk && it.present && groupsOf(m).includes(sk.g)){
        const s = m.skills[sk.id] || (m.skills[sk.id] = { lvl: 0, dates: {} }); s.dates = s.dates || {};
        if ((s.lvl || 0) < lvl){ s.lvl = lvl; s.dates[lvl] = dt; raised++; }
      }
      m.updatedAt = Date.now();
    }
    save(); closeSheet(); render();
    const due = ms.filter(m => meetingDue(m)).map(m => shortFio(m.fio));
    toast(`Сохранено: ${ms.length} ${plural(ms.length,'новичок','новичка','новичков')}${raised ? ', навык отмечен у ' + raised : ''}${due.length ? '. Пора беседа: ' + due.join(', ') : ''}`);
  },

  noteSave: () => {

    if (n.date > today()){ toast('Дата смены не может быть в будущем'); return; }
    if (m.hireDate && n.date < m.hireDate){ toast('Дата раньше даты приёма'); return; }
    const hs = sheet.help, htxt = $('#nHelpText').value.trim();
    if (hs.on && !hs.reason){ toast('Выберите причину — одним касанием'); return; }
    if (hs.on && hs.reason === 'other' && !htxt){ toast('Напишите коротко, что случилось'); $('#nHelpText').focus(); return; }
    if (sheet.rec){ try { sheet.rec.stop(); } catch(e) {} }
    n.comment = $('#nComment').value.trim().slice(0, COMMENT_MAX);
    if (hs.on && !n.help) n.helpResolved = false;
    n.help = hs.on; n.helpReason = hs.on ? hs.reason : ''; n.helpText = hs.on ? htxt : '';
    const no = noteShiftNo(m, n, n.date);
    n.tags = (n.tags || []).filter(t => { const d = TAG_MAP[t]; if (!d) return true; if (!n.present) return !!d.absent; return !d.absent && tagAllowed(d, no); });
    if (!n.help) n.helpResolved = false;
    n.nextSkill = $('#nNext').value; n.nextText = $('#nNextText').value.trim();
    if (!n.present){ n.score = 0; n.tags = []; }
    n.ts = Date.now();
    const same = m.notes.find(x => x.date === n.date && x.id !== n.id);
    if (same){
      if (!confirm(`За ${fmt(n.date)} уже есть отметка. Заменить её?`)) return;
      m.notes = m.notes.filter(x => x.id !== same.id);
    }
    const i = m.notes.findIndex(x => x.id === n.id);
    if (i >= 0) m.notes[i] = n; else m.notes.push(n);
    touch(m); closeSheet(); render();
    const due = meetingDue(m);

  lvl: d => {

    s.dates = s.dates || {};

    for (const k of Object.keys(s.dates)) if (+k > l) delete s.dates[k];

      const it = findSkill(d.s);

      const cancelled = gs.filter(g => m.admissions[g] && m.admissions[g].status === 'requested');

    const inp = $('#ck_' + d.g), v = inp.value.trim(); if (!v) return;
    S.settings.checklist[d.g].push({ id: `${d.g}_c${uid()}`, name: v }); S.mentees.forEach(m => m.updatedAt = Date.now()); save(); render();
    const det = document.querySelectorAll('#app details.card')[GROUPS.findIndex(g => g[0] === d.g)]; if (det) det.open = true;
  },
  ckReset: () => { if (!confirm('Вернуть стандартные пункты? Ваши добавленные пункты пропадут из списка.')) return; S.settings.checklist = makeChecklist(); save(); render(); toast('Чек-лист восстановлен'); },

  backup: async () => {
    const res = await shareFile(`наставник_копия_${safeName(shortFio(S.settings.fio))}_${fileStamp()}.json`,
      { format: 'pasport-mentor-backup', version: 1, createdAt: new Date().toISOString(), state: S }, 'Копия: Карманный наставник');
    if (res !== 'cancel') toast(res === 'shared' ? 'Копия отправлена' : 'Копия сохранена в «Загрузки»');
  },
  import: () => { const f = $('#fileIn'); f.value = ''; f.click(); },
  wipe: () => {
    if (!confirm('Удалить всех новичков и все записи с этого телефона?')) return;
    if (!confirm('Точно? Восстановить можно будет только из сохранённой копии или отчётов.')) return;
    S = blankState(); save(); go('list'); toast('Данные удалены');
  }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act]; if (!fn) return;
  if (b.tagName === 'BUTTON') e.preventDefault();
  fn(b.dataset, b, e);
});
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.set; if (!k) return;
  S.settings[k] = e.target.value.trim(); save();
  if (k === 'fio' || k === 'shift') render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet) closeSheet(); });
$('#fileIn').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => handleFile(String(r.result)); r.onerror = () => alert('Не удалось прочитать файл'); r.readAsText(f, 'utf-8');
});
window.addEventListener('storage', e => { if (e.key === KEY){ load(); render(); } });

/* ---------- запуск ---------- */
load();
render();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
