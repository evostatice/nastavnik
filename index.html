<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Наставник">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Карманный наставник</title>
<style>
/* Палитра «Паспорта смены»: тёмная тема, панели с тонкой рамкой, синий акцент */
:root{
  --bg:#0f1117; --surf:#161b22; --surf2:#0d1117; --ink:#e1e4e8; --mute:#8b949e; --line:#30363d;
  --mark:#58a6ff; --markInk:#0f1117; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --info:#58a6ff;
  --okBg:rgba(63,185,80,.14); --warnBg:rgba(210,153,34,.14); --badBg:rgba(248,81,73,.14); --infoBg:rgba(88,166,255,.14);
  --r:12px; --tap:48px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}   /* иначе display:grid/flex у классов перебивает атрибут hidden */
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
input:focus,select:focus,textarea:focus{border-color:var(--info);outline:none}

header.top{position:sticky;top:0;z-index:5;background:var(--surf);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:10px;padding:0 16px;height:56px}
.topin h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--info)}
.topin .who{font-size:13px;color:var(--mute);text-align:right;line-height:1.25}
.back{border:0;background:var(--surf2);border-radius:12px;min-width:var(--tap);height:40px;font-size:20px}

main{max-width:640px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom,0px))}

nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surf);border-top:1px solid var(--line);
  display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bot button{flex:1;border:0;background:none;padding:8px 4px 10px;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav.bot button .ic{font-size:22px;line-height:1}
nav.bot button.on{color:var(--ink);font-weight:600}
nav.bot button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;background:var(--mark);border-radius:0 0 3px 3px}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:10px;padding:1px 6px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surf);font-weight:600;text-align:center}
.btn.main{background:var(--mark);color:var(--markInk);border-color:transparent}
.btn.dark{background:var(--infoBg);color:var(--info);border-color:var(--info)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.wide{width:100%}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1}

.note{background:var(--surf);border:1px solid var(--line);border-left:5px solid var(--mark);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;font-size:15px}
.note b{display:block;margin-bottom:4px}
.note .row{margin-top:10px}
.muted{color:var(--mute)}
.small{font-size:13px}
h2{font-size:17px;margin:22px 2px 10px}
h2:first-child{margin-top:4px}

/* Карточка подопечного */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.tap{cursor:pointer}
.chead{display:flex;align-items:flex-start;gap:10px}
.chead .nm{font-weight:700;font-size:17px;line-height:1.25}
.chead .sub{font-size:13px;color:var(--mute);margin-top:2px}
.chead .num{margin-left:auto;text-align:right;flex-shrink:0}
.chead .num b{font-size:26px;line-height:1;display:block;font-variant-numeric:tabular-nums}
.chead .num span{font-size:11px;color:var(--mute)}

/* Лесенка смен */
.ladder{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin:12px 0 6px}
.ladder i{height:14px;border-radius:3px;background:var(--surf2);border:1px solid var(--line);position:relative}
.ladder i.f{background:var(--info);border-color:var(--info)}
.ladder i.m{border:2px solid var(--warn)}
.ladder i.m.f{background:var(--info)}
.ladder i.m.done::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--warn)}
.ladcap{display:flex;justify-content:space-between;font-size:12px;color:var(--mute)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:13px;padding:4px 10px;border-radius:20px;background:var(--surf2);border:1px solid var(--line);line-height:1.3}
.chip.bad{background:var(--badBg);border-color:transparent;color:var(--bad);font-weight:600}
.chip.warn{background:var(--warnBg);border-color:transparent;color:var(--warn);font-weight:600}
.chip.ok{background:var(--okBg);border-color:transparent;color:var(--ok);font-weight:600}
.chip.info{background:var(--infoBg);border-color:transparent;color:var(--info);font-weight:600}
.cact{display:flex;gap:8px;margin-top:12px}
.cact .btn{flex:1}

.bar{height:8px;border-radius:5px;background:var(--surf2);overflow:hidden;border:1px solid var(--line)}
.bar>span{display:block;height:100%;background:var(--ok)}
.barrow{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute);margin-top:8px}
.barrow .bar{flex:1}

/* Вкладки внутри карточки */
.tabs{display:flex;gap:4px;background:var(--bg);border-bottom:1px solid var(--line);margin:4px 0 14px;position:sticky;top:57px;z-index:4}
.tabs button{flex:1;border:0;border-bottom:2px solid transparent;background:none;min-height:44px;font-size:14px;font-weight:600;color:var(--mute);margin-bottom:-1px}
.tabs button.on{color:var(--info);border-bottom-color:var(--info)}

/* Навыки */
.skill{padding:12px 0;border-top:1px solid var(--line)}
.skill:first-of-type{border-top:0}
.skill .sn{font-size:15px;margin-bottom:8px}
.skill .sd{font-size:12px;color:var(--mute);margin-top:6px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.seg button{border:1px solid var(--line);background:var(--surf2);border-radius:9px;min-height:40px;font-size:12.5px;padding:2px;line-height:1.15}
.seg button.on.l0{background:var(--surf);border-color:var(--ink);font-weight:700}
.seg button.on.l1{background:var(--infoBg);border-color:var(--info);color:var(--info);font-weight:700}
.seg button.on.l2{background:var(--warnBg);border-color:var(--warn);color:var(--warn);font-weight:700}
.seg button.on.l3{background:var(--okBg);border-color:var(--ok);color:var(--ok);font-weight:700}
.ghead{display:flex;justify-content:space-between;align-items:baseline}
.ghead b{font-size:16px}

/* История смен */
.hist{display:flex;gap:12px}
.hist .dt{flex-shrink:0;width:54px;text-align:center;border-radius:10px;background:var(--surf2);padding:6px 0}
.hist .dt b{display:block;font-size:20px;line-height:1.1}
.hist .dt span{font-size:11px;color:var(--mute)}
.hist .bd{flex:1;min-width:0}
.hist .bd p{margin:6px 0 0;font-size:15px;white-space:pre-wrap;word-wrap:break-word}

/* Формы */
label.f,div.f{display:block;margin-bottom:16px}
label.f>span{display:block;font-size:12px;color:var(--mute);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{
  width:100%;min-height:var(--tap);border-radius:12px;border:1px solid var(--line);background:var(--surf2);padding:10px 12px;font-size:16px}
textarea{min-height:88px;resize:vertical}
.pick{display:grid;gap:6px}
.pick.c2{grid-template-columns:1fr 1fr}
.pick.c5{grid-template-columns:repeat(5,1fr)}
.pick button{border:1px solid var(--line);background:var(--surf2);border-radius:12px;min-height:var(--tap);font-weight:600;padding:4px}
.pick button.on{background:var(--info);color:var(--markInk);border-color:var(--info)}
.pick.c5 button{font-size:20px}
.pick.c5 button small{display:block;font-size:10.5px;font-weight:500}
.tagset{display:flex;flex-wrap:wrap;gap:6px}
.tagset button{border:1px solid var(--line);background:var(--surf2);border-radius:20px;padding:8px 12px;font-size:14px}
.tagset button.on{background:var(--info);color:var(--markInk);border-color:var(--info)}
.tagset button.tg{border-width:1.5px;text-align:left;line-height:1.25}
.tg.pos{border-color:var(--ok);color:var(--ok)}
.tg.neg{border-color:var(--bad);color:var(--bad)}
.tg.neu{border-color:var(--warn);color:var(--warn)}
.tagset button.tg.on.pos{background:var(--ok);border-color:var(--ok);color:var(--surf)}
.tagset button.tg.on.neg{background:var(--bad);border-color:var(--bad);color:var(--surf)}
.tagset button.tg.on.neu{background:var(--warn);border-color:var(--warn);color:var(--surf)}
.tg[aria-disabled="true"]{opacity:.4}
.tg small{display:block;font-size:11px;opacity:.85;font-weight:400}
.tgh{font-size:14px;font-weight:700;margin:14px 0 6px}
.tgh span{font-weight:400}
.tgfoot{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.linkbtn{border:0;background:none;color:var(--info);font-weight:600;padding:8px 0;min-height:40px}
.qrow{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.qrow button{flex-shrink:0;border:1px solid var(--line);background:var(--surf);border-radius:20px;padding:8px 12px;font-size:14px;min-height:40px;white-space:nowrap}
.cnt{text-align:right;font-size:12px;color:var(--mute);margin-top:4px}
textarea.grow{min-height:var(--tap);height:var(--tap);resize:none;overflow:hidden;line-height:1.4}
.helpbar{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surf2);color:var(--mute);text-align:left;margin:6px 0 10px}
.helpbar .hic{font-size:26px;line-height:1;flex-shrink:0}
.helpbar b{display:block;color:var(--mute);font-size:16px}
.helpbar small{display:block;font-size:13px}
.helpbar.on{background:var(--bad);border-color:var(--bad);color:#fff}
.helpbar.on b{color:#fff}
.helpbar.pulse{animation:hpulse .5s ease-out 1}
@keyframes hpulse{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.helpbar.pulse{animation:none}}
.helpbar.sm{min-height:48px;padding:8px 12px;margin:8px 0 0}
.helpbar.sm b{font-size:15px}
.reasons{margin-bottom:8px}
.reasons button{font-size:14px}
.reasons button.on{background:var(--bad);border-color:var(--bad);color:#fff}
.obrow{display:flex;align-items:flex-start;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;background:none;padding:2px 0 6px;text-align:left;min-height:40px;font-size:16px}
.sechead .caret{display:inline-block;width:14px;text-align:center}
.sechead>.muted{white-space:nowrap;flex-shrink:0}
.card:has(> .sechead[aria-expanded="false"]){padding-top:10px;padding-bottom:10px}
.sechead[aria-expanded="false"]{padding-bottom:2px}
.sechead+.obrow,.sechead+.skill{border-top:0}
.bsec{margin-bottom:6px}
.bsec summary{cursor:pointer;font-weight:700;font-size:14px;padding:8px 0;min-height:40px}
.obmark{flex-shrink:0;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--surf);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--surf);font-size:16px;margin-top:2px}
.obrow.ok .obmark{background:var(--ok);border-color:var(--ok)}
.obbody{flex:1;min-width:0;text-align:left;border:0;background:none;padding:6px 0;min-height:40px}
.obt{font-size:15px;line-height:1.3;display:flex}
.obtx{flex:1;min-width:0}
.obrow.ok .obt{color:var(--mute)}
.obn{display:inline-block;min-width:34px;color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.obd{font-size:12px;color:var(--mute);margin-left:34px}
.obcarry{font-size:11px;font-weight:700;color:var(--warn);background:var(--warnBg);border-radius:8px;padding:1px 6px;white-space:nowrap}
.obinfo{flex-shrink:0;border:0;background:none;color:var(--mute);font-size:18px;width:36px;height:40px}
.obfull{font-size:13px;color:var(--mute);padding:0 0 8px 44px}
.obq{margin:6px 0 0;padding-left:18px;color:var(--ink)}
.obq li{margin:4px 0}
.obchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.obchips button{border:1.5px solid var(--line);background:var(--surf2);border-radius:18px;padding:7px 11px;font-size:13.5px;min-height:38px}
.obchips button.on{background:var(--ok);border-color:var(--ok);color:var(--surf);font-weight:600}
.obsum{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:0;background:none;padding:2px 0;font-size:15px;text-align:left}
.chip.tp{color:var(--ok);border-color:var(--ok)}
.chip.tn{color:var(--bad);border-color:var(--bad)}
.chip.tz{color:var(--warn);border-color:var(--warn)}
.check{display:flex;align-items:center;gap:12px;min-height:var(--tap);padding:6px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surf2);margin-bottom:8px}
.check input{width:22px;height:22px;flex-shrink:0}
.check.alert{border-color:var(--bad)}

/* Главный экран: «Сегодня», фильтры, компактные строки */
.today .trow{display:flex;gap:10px;align-items:flex-start;padding:4px 0}
.tlink{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:0;min-height:40px}
.tlink b{flex:1;min-width:0;font-size:15px}
.tcnt{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.tgo{color:var(--mute);font-size:22px;line-height:1}
.today .trow .tic{padding-top:8px}
.today .trow+.trow{border-top:1px solid var(--line)}
.today .trow.warn b{color:var(--warn)}
.tic{font-size:20px;line-height:1.3;flex-shrink:0}
.tbd{flex:1;min-width:0}
.tbd>b{display:block;font-size:15px;padding-top:8px}
.nchips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.nchip{border:1px solid var(--line);background:var(--surf2);border-radius:16px;padding:6px 11px;font-size:13.5px;min-height:36px}
.nchip.more{background:transparent;color:var(--info);font-weight:600;border-color:transparent}
.lctl{display:flex;gap:8px;margin:14px 0 8px}
.lctl input{flex:1;min-width:0}
.lctl .btn{flex-shrink:0;min-height:var(--tap)}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.fchips button{flex-shrink:0;border:1px solid var(--line);background:var(--surf);border-radius:18px;padding:6px 12px;font-size:14px;min-height:38px;white-space:nowrap}
.fchips button.on{background:var(--infoBg);color:var(--info);border-color:var(--info);font-weight:600}
.fchips button span{opacity:.65;font-size:12px}
.mrow{display:flex;align-items:center;gap:10px;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 14px;margin-bottom:6px;cursor:pointer}
.mmain{flex:1;min-width:0}
.mnm{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msub{font-size:12.5px;color:var(--mute);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar{height:4px;border-radius:3px;background:var(--surf2);margin-top:6px;overflow:hidden}
.mbar span{display:block;height:100%;background:var(--ok)}
.mic{display:flex;gap:2px;font-size:16px;flex-shrink:0}
.mbtn{flex-shrink:0;width:46px;height:46px;border-radius:12px;border:0;background:var(--mark);color:var(--markInk);font-size:20px;font-weight:800}
.mbtn.done{background:var(--okBg);color:var(--ok)}

/* Групповая отметка «исключениями» */
.brow{border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:6px;background:var(--surf)}
.btop{display:flex;align-items:center;gap:8px}
.bpres{flex-shrink:0;width:46px;height:46px;border-radius:12px;border:2px solid var(--ok);background:var(--okBg);color:var(--ok);font-size:20px;font-weight:800}
.bpres.off{border-color:var(--bad);background:var(--badBg);color:var(--bad)}
.bname{flex:1;min-width:0;text-align:left;border:0;background:none;padding:2px 0;min-height:46px}
.bname b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btop .bout{width:96px;flex-shrink:0;padding:8px 10px}
.bmore{margin-top:8px}

/* «Пункты группе» */
.gwrap{overflow-x:auto;margin:0 -16px;padding:0 16px;-webkit-overflow-scrolling:touch}
table.grid{border-collapse:separate;border-spacing:0;font-size:13px}
.grid th,.grid td{border-bottom:1px solid var(--line);padding:4px;text-align:center;vertical-align:middle}
.grid th{font-size:11px;font-weight:600;color:var(--mute);min-width:52px;line-height:1.2;white-space:nowrap}
.grid .gfirst{position:sticky;left:0;background:var(--surf);text-align:left;min-width:150px;max-width:180px;z-index:1;box-shadow:1px 0 0 var(--line)}
.gall{border:0;background:none;text-align:left;padding:4px 0;font-size:13px;line-height:1.25;min-height:44px;width:100%}
.gall small{display:block;color:var(--info);font-weight:600;font-size:11.5px}
.gcell{width:42px;height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surf2);font-weight:800;font-size:16px;color:#fff}
.gcell.on{background:var(--ok);border-color:var(--ok)}
.gna{color:var(--mute)}

/* Нижний лист */
#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.open{display:block}
#sheet .shade{position:absolute;inset:0;background:rgba(0,0,0,.7)}
#sheet .pane{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--surf);border:1px solid var(--line);border-bottom:0;border-radius:var(--r) var(--r) 0 0;
  padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#sheet .pane{animation:none}}
.grip{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.pane h3{font-size:18px;margin:0 0 4px}
.pane .lead{font-size:14px;color:var(--mute);margin:0 0 16px}
.pane .actions{display:flex;gap:10px;margin-top:18px;position:sticky;bottom:-18px;background:var(--surf);padding:10px 0 4px}
.pane .actions .btn{flex:1}

/* Окно подтверждения — своё, т.к. confirm() в части браузеров молча возвращает «Отмена» */
#ask{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
#ask[hidden]{display:none}
#ask .shade{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#ask .box{position:relative;background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px 14px;max-width:420px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.3)}
#ask p{margin:0 0 16px;font-size:16px;white-space:pre-line}
#ask .row>.btn{flex:1}

#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surf);color:var(--ink);border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.4);
  padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}

.empty{text-align:center;padding:28px 12px}
.empty .big{font-size:44px}
.empty p{color:var(--mute);margin:8px 0 18px}
.list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list-item:first-child{border-top:0}
.list-item span{flex:1}
.x{border:0;background:var(--surf2);border-radius:10px;width:40px;height:40px;font-size:16px;color:var(--mute)}
details.arch summary{cursor:pointer;padding:10px 2px;color:var(--mute);font-weight:600}
.sign{text-align:center;font-size:12px;color:var(--mute);margin:26px 0 6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--mute)}
.kv dd{margin:0}
.big-send{padding:22px 16px;text-align:center}
.big-send .n{font-size:44px;font-weight:800;line-height:1}
.task{margin-top:10px;padding:8px 12px;border-radius:10px;background:var(--surf2);border:1px dashed var(--line);font-size:14px}
/* Свободный текст наставника (задача, комментарий, причина) переносится, даже если это одно длинное слово */
.task,.risk,.note,.hist .bd,.kv dd,.adm,.obfull,.chip,.tg,.nchip,.chead .nm,.ans span{overflow-wrap:anywhere}
.chead>div:first-child{min-width:0}
.task b{font-weight:600}
.risk{margin-top:10px;padding:8px 12px;border-radius:10px;background:var(--badBg);color:var(--bad);font-size:14px}
.risk b{display:block}
.adm{margin:6px 0 2px;padding:10px 12px;border-radius:10px;background:var(--surf2)}
.adm .row{margin-top:8px}
.hints{background:var(--surf2);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.hints summary{cursor:pointer;font-weight:600}
.hints ul{margin:8px 0 2px;padding-left:18px}
.hints li{margin:4px 0}
.hq li{margin:8px 0}
.hq .hqt{display:block;font-size:12px;color:var(--mute)}
.hq .hqa{display:block;font-size:15px;font-weight:600}
.hq li.key{background:var(--warnBg);border-radius:10px;padding:8px 10px;margin-left:-18px;list-style:none}
.hq .hqn{display:block;font-size:13px;color:var(--warn);margin-top:4px;font-weight:600}
.crit{background:var(--warnBg);border:1px solid var(--warn);border-left:5px solid var(--warn);border-radius:var(--r);padding:12px 14px;margin:4px 0 14px;font-size:15px}
.crit>b{display:block;color:var(--warn);font-size:16px;margin-bottom:6px}
.crit ul{margin:0 0 10px;padding-left:20px}
.crit li{margin:4px 0}
.crit p{margin:0;padding-top:10px;border-top:1px dashed var(--warn)}
.sq{margin-bottom:14px}
.sq>div:first-child{font-size:15px;margin-bottom:6px}
.pick.c5n button{font-size:17px}
.pick.c5n button small{display:block;font-size:10px;font-weight:500;line-height:1.1}
.ans{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0;border-top:1px solid var(--line)}
.ans:first-child{border-top:0}
.ans b.low{color:var(--bad)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--mute)}
.stat.wide{grid-column:1/-1}
.hbar{margin:10px 0}
.hbar .lbl{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px;gap:8px}
.hbar .bar>span.w{background:var(--warn)}
.hbar .bar>span.b{background:var(--bad)}
</style>
</head>

function ask(msg, noCancel){

    $('#askMsg').textContent = msg; yes.textContent = noCancel ? 'Понятно' : 'Да'; no.hidden = !!noCancel;

const ISO_RE = /^\d{4}-\d{2}-\d{2}$/;

function normNote(n){
  n.id = okId(n.id); n.date = okDate(n.date); n.present = n.present !== false;
  n.score = Math.max(0, Math.min(5, parseInt(n.score, 10) || 0));
  n.tags = Array.isArray(n.tags) ? n.tags.filter(t => typeof t === 'string') : [];
  for (const k of ['comment', 'helpText', 'nextText', 'nextSkill', 'helpReason']) n[k] = okStr(n[k]);
  if (!HELP_LABEL[n.helpReason]) n.helpReason = '';
  n.help = !!n.help; n.helpResolved = !!n.helpResolved; n.ts = +n.ts || 0;
  return n;
}
function normMentee(m){
  m.id = okId(m.id); m.fio = okStr(m.fio); m.tab = okStr(m.tab); m.hireDate = okDate(m.hireDate);
  const before = JSON.stringify([m.mainGroup, m.groups, m.admissions]);
  m.mainGroup = WORK_GROUPS.some(g => g[0] === m.mainGroup) ? m.mainGroup : WORK_GROUPS[0][0];
  m.groups = (Array.isArray(m.groups) ? m.groups : []).filter(g => WORK_GROUPS.some(x => x[0] === g));
  if (!m.groups.length) m.groups = [m.mainGroup];
  if (m.admissions) for (const g of Object.keys(m.admissions)) if (!WORK_GROUPS.some(x => x[0] === g)) delete m.admissions[g];
  if (m.mainGroup && before !== JSON.stringify([m.mainGroup, m.groups, m.admissions]) && m.updatedAt) m.updatedAt = Date.now();   // уйдёт в следующий отчёт
  if (!m.groups.includes(m.mainGroup)) m.groups.unshift(m.mainGroup);
  m.shiftsBefore = Math.max(0, Math.min(200, parseInt(m.shiftsBefore, 10) || 0));
  m.status = ['active', 'done', 'left'].includes(m.status) ? m.status : 'active';
  m.statusDate = okDate(m.statusDate); m.statusReason = okStr(m.statusReason); m.statusComment = okStr(m.statusComment);
  m.skills = okObj(m.skills);
  // отметки без корректной даты отбрасываются: из-за них не открывался список
  m.notes = (Array.isArray(m.notes) ? m.notes : []).filter(n => n && typeof n === 'object').map(normNote).filter(n => n.date);
  m.meetings = okObj(m.meetings);
  for (const k of Object.keys(m.meetings)){
    const mt = m.meetings[k];
    if (!MEET.includes(+k) || !mt || typeof mt !== 'object'){ delete m.meetings[k]; continue; }
    mt.done = !!mt.done; mt.date = okDate(mt.date); mt.comment = okStr(mt.comment);
    const a = okObj(mt.answers); mt.answers = {};
    for (const [id] of SURVEY){ const v = parseInt(a[id], 10); if (v >= 1 && v <= 5) mt.answers[id] = v; }
  }
  m.admissions = okObj(m.admissions);
  for (const g of Object.keys(m.admissions)){ const a = m.admissions[g];
    if (!a || typeof a !== 'object' || !['requested', 'confirmed'].includes(a.status)){ delete m.admissions[g]; continue; }
    a.date = okDate(a.date); a.confirmedDate = okDate(a.confirmedDate); a.comment = okStr(a.comment); }
  m.onboard = okObj(m.onboard);
  for (const k of Object.keys(m.onboard)) if (!okDate(m.onboard[k])) delete m.onboard[k];
  // выработка: { номер смены: коробов } — только целые числа

  m.createdAt = +m.createdAt || Date.now(); m.updatedAt = +m.updatedAt || Date.now();
  return m;
}
/* Кэш расчётов на одну перерисовку: номер смены, отметки по дате, риски считаются по разу на новичка.
   Сбрасывается при каждом сохранении и перерисовке */
let GEN = 0;
const MEMO = new WeakMap();
function memo(m, key, fn){
  let c = MEMO.get(m);
  if (!c || c.g !== GEN){ c = { g: GEN }; MEMO.set(m, c); }
  return key in c ? c[key] : (c[key] = fn());
}
function save(){
  GEN++;
  try { localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch(e){ toast('Не удалось сохранить: память браузера недоступна'); return false; }
}
function touch(m){ m.updatedAt = Date.now(); save(); }
const findM = id => S.mentees.find(m => m.id === id);

/* ---------- расчёты ---------- */
const presentNotes = m => m.notes.filter(n => n.present);
const worked = m => memo(m, 'worked', () => (+m.shiftsBefore || 0) + presentNotes(m).length);
function stageOf(n){ if (n < 3) return 'Обучение (дни 1–3)'; if (n < 14) return 'Закрепление'; return 'Самостоятельная работа'; }   // n — отработано смен
const groupsOf = m => m.groups.filter(g => GNAME[g]);
/* Номер текущей смены новичка: смены до записей + отмеченные выходы до сегодняшней смены + эта */
function curShiftNo(m){ return memo(m, 'cur', () => shiftOnDate(m, shiftDefaultDate())); }
/* Номер смены новичка на дату: смены до записей + отмеченные выходы раньше этой даты + эта */
function shiftOnDate(m, d){ return (+m.shiftsBefore || 0) + m.notes.filter(n => n.present && n.date < d).length + 1; }
const obItemDone = (m, it) => it.meet ? meetDone(m, it.meet) : it.sub ? it.sub.every(s => m.onboard[s.id]) : !!m.onboard[it.id];
const itemDate = (m, it) => it.meet ? (meetDone(m, it.meet) ? m.meetings[it.meet].date : '') : (m.onboard[it.id] || '');
const obSectionLeft = (m, sec) => sec.items.filter(it => !obItemDone(m, it)).length;
const obLeft = m => ONBOARD.reduce((a, s) => a + obSectionLeft(m, s), 0);
const obTotal = ONBOARD.reduce((a, s) => a + s.items.length, 0);
const onboardDone = m => obLeft(m) === 0;
const trLeft = m => TRAINING.reduce((a, s) => a + obSectionLeft(m, s), 0);
const trTotal = TRAINING.reduce((a, s) => a + s.items.length, 0);
const trainingDone = m => trLeft(m) === 0;
const opsLeft = m => OPS.reduce((a, s) => a + obSectionLeft(m, s), 0);
const opsTotal = OPS.reduce((a, s) => a + s.items.length, 0);
const opsDone = m => opsLeft(m) === 0;
/* Пункт «что отрабатываем дальше» выполнен: пункт чек-листа отмечен (или старый навык — «допущен») */
const unitDone = (m, id) => !!m.onboard[id] || (m.skills[id]?.lvl || 0) === 3;
const secOfUnit = id => ALL_CHECK.find(s => s.items.some(it => it.id === id || (it.sub && it.sub.some(u => u.id === id))));
function secDoneDate(m, sec){ let d = ''; for (const it of sec.items) for (const u of (it.sub || [it])) if (itemDate(m, u) > d) d = itemDate(m, u); return d; }
/* Прогресс обучения: доля выполненных пунктов «Старт» + «Подготовка» + «Обучение операциям» */
const ALL_ITEMS = ALL_CHECK.reduce((a, s) => a + s.items.length, 0);
function progress(m){ return Math.round((ALL_ITEMS - ALL_CHECK.reduce((a, s) => a + obSectionLeft(m, s), 0)) / ALL_ITEMS * 100); }
/* Уровни навыков прежних версий — только для отчёта (поле calc.levels) */
function countLevels(m){
  const c = [0,0,0,0];
  for (const g of groupsOf(m)) for (const it of (S.settings.checklist[g] || [])) c[m.skills[it.id]?.lvl || 0]++;
  return c;
}
const meetDone = (m, k) => !!(m.meetings[k] && m.meetings[k].done);
function nextMeeting(m){ for (const k of MEET) if (!meetDone(m, k)) return k; return null; }
/* Беседа k-й смены положена уже на самой k-й смене (как и пункт «Беседа» в «Дне 3») */
const meetingDue = m => { const k = nextMeeting(m); return k !== null && curShiftNo(m) >= k ? k : null; };
const openHelp = m => m.notes.filter(n => n.help && !n.helpResolved);
const sortedNotes = m => memo(m, 'sorted', () => [...m.notes].sort((a, b) => b.date.localeCompare(a.date) || b.ts - a.ts));
const lastNote = m => sortedNotes(m)[0];
const unsent = () => S.mentees.filter(m => m.updatedAt > S.lastSentAt);
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
function shiftNoAt(m, date){ return (+m.shiftsBefore || 0) + m.notes.filter(n => n.present && n.date <= date).length; }
/* Название пункта по id: пункт чек-листа или навык прежних версий */
function findSkill(id){
  if (!id) return null;
  for (const sec of ALL_CHECK) for (const it of sec.items){
    if (it.id === id) return { id, name: `${it.n} ${it.t}` };
    const su = it.sub && it.sub.find(u => u.id === id); if (su) return { id, name: `${it.n} ${su.t}` };
  }
  for (const [g] of GROUPS){ const it = (S.settings.checklist[g] || []).find(x => x.id === id); if (it) return Object.assign({ g }, it); }
  return null;
}
const allDone = m => onboardDone(m) && trainingDone(m) && opsDone(m);
function canAdmit(m, g){ return allDone(m) && curShiftNo(m) >= ADMIT_SHIFT && !m.admissions[g]; }
function lastSurvey(m){
  for (const k of [...MEET].reverse()){ const mt = m.meetings[k]; if (mt && mt.done && mt.answers && Object.values(mt.answers).some(Boolean)) return { k, a: mt.answers }; }
  return null;
}
/* Риск ухода: только прозрачные правила, чтобы наставник видел причину */
function riskReasons(m){ return memo(m, 'risk', () => calcRisk(m)); }
function calcRisk(m){
  if (m.status !== 'active') return [];
  const r = [], ns = sortedNotes(m);
  if (ns.length >= 2 && !ns[0].present && !ns[1].present) r.push('2 невыхода подряд');
  else if (ns.slice(0, 5).filter(n => !n.present).length >= 2) r.push('частые невыходы');
  const scored = ns.filter(n => n.present && n.score);
  if (scored.length >= 2 && scored[0].score <= 2 && scored[1].score <= 2) r.push('две слабые смены подряд');
  if (ns.slice(0, 3).some(n => (n.tags || []).some(t => LOAD_TAGS.includes(t)))) r.push('жалобы на нагрузку или самочувствие');
  if (ns.slice(0, 3).some(n => (n.tags || []).includes('Конфликтует с коллегами'))) r.push('конфликт с коллегами');
  if (ns.slice(0, 5).some(n => (n.tags || []).includes('Отсутствовал без предупреждения'))) r.push('не вышел без предупреждения');
  if (openHelp(m).some(n => n.helpReason === 'leave')) r.push('наставник видит риск ухода');
  const s = lastSurvey(m);
  if (s){
    if (s.a.stay && s.a.stay <= 2) r.push('не уверен, что останется');
    const v = avg(Object.values(s.a).filter(Boolean));
    if (v !== null && v <= 2.5) r.push('низкие ответы в беседе');
  }
  const k = nextMeeting(m);
  if (k !== null && worked(m) >= k + 2) r.push(`беседа ${k}-й смены просрочена`);
  return r;
}
function nextTask(m){
  const ln = lastNote(m);
  if (!ln || (!ln.nextSkill && !ln.nextText)) return null;
  const it = ln.nextSkill ? findSkill(ln.nextSkill) : null;
  if (it && unitDone(m, it.id) && !ln.nextText) return null;
  return { name: it ? it.name : '', text: ln.nextText || '' };
}
function taskHtml(m){
  const t = nextTask(m); if (!t || m.status !== 'active') return '';
  return `<div class="task">📌 На следующей смене: <b>${esc([t.name, t.text].filter(Boolean).join('. '))}</b></div>`;
}
function riskHtml(m){
  const r = riskReasons(m); if (!r.length) return '';
  return `<div class="risk"><b>Риск ухода</b>${esc(r.join(', '))}</div>`;
}

/* ---------- состояние экрана ---------- */

let sheet = null;   // контекст открытого листа

function go(view, id){ ui.view = view; if (id !== undefined) ui.id = id; if (view === 'mentee' && id !== undefined) ui.tab = 'shifts'; render(); window.scrollTo(0,0); }

function ladderHtml(m){
  const w = worked(m);
  let cells = '';
  for (let i = 1; i <= 14; i++){
    const isM = MEET.includes(i);
    cells += `<i class="${i <= w ? 'f' : ''} ${isM ? 'm' : ''} ${isM && meetDone(m, i) ? 'done' : ''}" title="Смена ${i}${isM ? ', беседа' : ''}"></i>`;
  }
  return `<div class="ladder" aria-label="Отработано смен: ${w}">${cells}</div>
    <div class="ladcap"><span>${esc(stageOf(w))}</span><span>${w > 14 ? `+${w-14} после 14-й` : 'беседы на 3, 7 и 14 смене'}</span></div>`;
}

function outputChip(k, v){
  const g = OUTPUT_GOAL[k], ok = v >= g[0];
  return `<span class="chip ${ok ? 'ok' : 'warn'}">📈 ${k}-я смена: ${v} кор.${ok ? '' : ` (цель ${goalText(g)})`}</span>`;
}
/* Итог под полем «Факт выработка»; обновляется на месте, без перерисовки экрана */
function outStatus(k, v){
  if (v === undefined) return '';
  const g = OUTPUT_GOAL[k];
  return `<div class="chips">${v >= g[0] ? '<span class="chip ok">✓ Цель выполнена</span>' : `<span class="chip warn">До цели не хватило ${g[0] - v} кор.</span>`}</div>`;
}
function flagsHtml(m){
  const f = [];
  const help = openHelp(m).length;
  if (help) f.push(`<span class="chip bad">🚨 ${esc(helpTitle(openHelp(m)[0]))}</span>`);
  const due = meetingDue(m);
  if (due) f.push(`<span class="chip warn">Пора провести беседу ${due}-й смены</span>`);
  const ln = lastNote(m);
  if (ln && !ln.present) f.push(`<span class="chip warn">Не вышел ${fmt(ln.date)}</span>`);
  if (m.status === 'active' && (!ln || ln.date < shiftDefaultDate())) f.push(`<span class="chip">Нет отметки за ${fmt(shiftDefaultDate()).slice(0,5)}</span>`);
  if (m.status === 'active' && !onboardDone(m) && curShiftNo(m) > 1) f.push(`<span class="chip warn">«Старт» не закрыт: ${obLeft(m)} ${plural(obLeft(m),'пункт','пункта','пунктов')}</span>`);
  for (const [g] of WORK_GROUPS){
    const a = m.admissions[g];
    if (a && a.status === 'requested') f.push(`<span class="chip info">Допуск: ${esc(GNAME[g])}, ждёт подтверждения</span>`);
    else if (m.status === 'active' && canAdmit(m, g) && m.groups.includes(g)) f.push(`<span class="chip ok">Можно оформить допуск: ${esc(GNAME[g])}</span>`);
  }
  for (const k of Object.keys(OUTPUT_GOAL)) if (m.output[k] !== undefined) f.push(outputChip(k, m.output[k]));
  if (m.updatedAt > S.lastSentAt) f.push(`<span class="chip info">Не отправлено</span>`);
  return f.length ? `<div class="chips">${f.join('')}</div>` : '';
}

function menteeCard(m){
  const w = worked(m), p = progress(m);
  return `<div class="card tap" data-act="open" data-id="${m.id}">
    <div class="chead">
      <div><div class="nm">${esc(m.fio || 'Без имени')}</div>

/* ---------- главный список: «Сегодня», фильтры, поиск, компактные строки ---------- */
const FILTERS = [['all', 'Все'], ['att', 'Внимание'], ['d1', 'День 1'], ['d2', 'День 2'], ['d3', 'День 3'], ['fix', '4+ смена']];
const noMark = m => { const ln = lastNote(m); return !ln || ln.date < shiftDefaultDate(); };
/* Смены с целью по выработке, за которые число не вписано (текущая — только если смена уже отмечена) */
function outMissing(m){
  const cur = curShiftNo(m), ln = lastNote(m), markedToday = ln && ln.present && ln.date === shiftDefaultDate();
  return Object.keys(OUTPUT_GOAL).map(Number).filter(k => m.output[k] === undefined && (cur > k || (cur === k && markedToday)));
}
const admitReady = m => groupsOf(m).some(g => canAdmit(m, g));
const needsAttention = m => !!(openHelp(m).length || riskReasons(m).length || meetingDue(m) || noMark(m) || outMissing(m).length || admitReady(m));
/* Дела на сегодня — строки блока «Сегодня»; их же можно выбрать фильтром списка */
const TASKS = [
  { k: 'help',   ic: '🚨', title: () => 'Нужна помощь руководителя', test: m => openHelp(m).length > 0, act: 'openT', tab: 'shifts', urgent: 1 },
  { k: 'risk',   ic: '🔻', title: () => 'Риск ухода', test: m => riskReasons(m).length > 0, act: 'openT', tab: 'shifts', urgent: 1 },
  { k: 'nomark', ic: '📝', title: () => `Нет отметки за ${fmt(shiftDefaultDate()).slice(0, 5)}`, test: noMark, act: 'noteNew', tab: '' },
  { k: 'meet',   ic: '💬', title: () => 'Пора провести беседу', test: m => !!meetingDue(m), act: 'openT', tab: 'meet' },
  { k: 'out',    ic: '📦', title: () => 'Не вписана выработка', test: m => outMissing(m).length > 0, act: 'openT', tab: 'shifts' },
  { k: 'admit',  ic: '✅', title: () => 'Можно оформить лист допуска', test: admitReady, act: 'openT', tab: 'skills' }
];
const TASK_MAP = Object.fromEntries(TASKS.map(t => [t.k, t]));
function matchFilter(m, f){
  if (TASK_MAP[f]) return TASK_MAP[f].test(m);
  if (f === 'att') return needsAttention(m);
  if (f === 'all') return true;
  const cur = curShiftNo(m);
  return f === 'fix' ? cur >= 4 : f === 'd' + cur;
}
function matchQuery(m){
  const q = (ui.q || '').trim().toLowerCase();
  return !q || m.fio.toLowerCase().includes(q) || m.tab.toLowerCase().includes(q);
}
function activeSorted(){
  const rank = m => (openHelp(m).length ? 0 : riskReasons(m).length ? 1 : meetingDue(m) ? 2 : 3);
  return S.mentees.filter(m => m.status === 'active').sort((a, b) => rank(a) - rank(b) || a.fio.localeCompare(b.fio, 'ru'));
}
function listHtml(act){
  const xs = act.filter(m => matchFilter(m, ui.filter) && matchQuery(m));
  if (!xs.length) return `<p class="muted" style="text-align:center;margin:18px 0">Никого не найдено</p>`;
  return S.settings.listMode === 'full' ? xs.map(menteeCard).join('') : xs.map(compactRow).join('');
}
function compactRow(m){
  const cur = curShiftNo(m), p = progress(m), ln = lastNote(m), rr = riskReasons(m);
  const ic = [openHelp(m).length && ['🚨', 'Нужна помощь руководителя'], rr.length && ['🔻', 'Риск ухода: ' + rr.join(', ')],

    outMissing(m).length && ['📦', 'Не вписана выработка'], admitReady(m) && ['✅', 'Можно оформить лист допуска']].filter(Boolean);
  // ✓ — отметить смену; если уже отмечена сегодня — открыть эту отметку
  const btn = noMark(m) ? `<button class="mbtn" data-act="noteNew" data-id="${m.id}" aria-label="Отметить смену">✓</button>`
    : `<button class="mbtn done" data-act="noteEdit" data-id="${m.id}" data-n="${ln.id}" aria-label="Смена отмечена, изменить">✓</button>`;
  return `<div class="mrow" data-act="open" data-id="${m.id}">
    <div class="mmain"><div class="mnm">${esc(m.fio || 'Без имени')}</div>

      <div class="mbar"><span style="width:${p}%"></span></div></div>

/* Архив, который можно удалить: завершили или уволились > 3 мес. назад и уже отправлены руководителю */
const oldArchived = () => S.mentees.filter(m => m.status !== 'active' && m.statusDate && m.statusDate < isoLocal(Date.now() - 90 * 864e5) && m.updatedAt <= S.lastSentAt);
function storeSize(){ try { return (localStorage.getItem(KEY) || '').length; } catch(e){ return 0; } }
function todayHtml(act){
  const rows = [], u = unsent();
  // напоминание об отправке: изменения есть, а отчёт не уходил 2 дня и больше
  const since = S.lastSentAt || Math.min(...u.map(m => m.createdAt));

    rows.push(`<div class="trow"><span class="tic">${t.ic}</span><div class="tbd">

  }
  return `<div class="card today"><div class="ghead"><b>Сегодня</b><span class="muted small">смена ${fmt(shiftDefaultDate()).slice(0, 5)}</span></div>
    ${rows.join('') || '<p class="muted small" style="margin:8px 0 0">Всё сделано ✅</p>'}</div>`;
}
function viewList(){
  let h = '';
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (!standalone && !S.settings.installHidden){
    const ios = /iP(hone|ad|od)/.test(navigator.userAgent);
    h += `<div class="note"><b>Добавьте на главный экран</b>
      ${ios ? 'В Safari нажмите «Поделиться» ⬆️, затем «На экран „Домой“».' : 'В меню браузера ⋮ выберите «Добавить на главный экран».'}
      Так приложение будет открываться одним касанием и работать без интернета, а iPhone не сотрёт ваши записи.
      <div class="row"><button class="btn sm ghost" data-act="hideInstall">Уже добавил</button></div></div>`;
  }
  if (!S.settings.fio){
    h += `<div class="note"><b>Начните с ваших данных</b>Укажите ФИО и смену — они попадут в отчёт руководителю.
      <div class="row"><button class="btn sm" data-act="go" data-v="settings">Заполнить</button></div></div>`;
  }
  const act = activeSorted();
  if (!act.length){
    h += `<div class="empty"><div class="big">🦺</div><p>Пока нет новичков. Добавьте того, кого вам закрепили, или загрузите задание от руководителя смены.</p>
      <div class="row"><button class="btn main" data-act="menteeNew">Добавить новичка</button></div>
      <div class="row" style="margin-top:10px"><button class="btn" data-act="import">Загрузить файл</button></div></div>`;
  } else {
    h += todayHtml(act);
    if (act.length >= 2) h += `<div class="row" style="margin-bottom:4px"><button class="btn dark" data-act="batch">✔️ Смена всем</button><button class="btn" data-act="grid">☑ Пункты всем</button></div>`;
    const compact = S.settings.listMode !== 'full';
    if (act.length >= 3) h += `<div class="lctl"><input type="search" id="q" placeholder="🔍 ФИО или таб. номер" value="${esc(ui.q)}" autocomplete="off">
        <button class="btn sm" data-act="listMode">${compact ? '☰ Подробно' : '▤ Кратко'}</button></div>
      <div class="fchips" id="fchips">${TASK_MAP[ui.filter] ? `<button class="on" data-act="filter" data-v="all">${TASK_MAP[ui.filter].ic} ${esc(TASK_MAP[ui.filter].title())} ✕</button>` : ''}${FILTERS.map(([k, l]) => `<button data-act="filter" data-v="${k}" class="${ui.filter === k ? 'on' : ''}">${l} <span>${act.filter(m => matchFilter(m, k)).length}</span></button>`).join('')}</div>`;
    else h += `<div style="height:10px"></div>`;
    h += `<div id="mlist">${listHtml(act)}</div>`;
    h += `<div class="row" style="margin-top:10px"><button class="btn" data-act="menteeNew">＋ Добавить новичка</button></div>`;
  }
  const arch = S.mentees.filter(m => m.status !== 'active');
  if (arch.length){
    h += `<details class="arch"><summary>Завершили и уволились (${arch.length})</summary>
      ${arch.map(m => `<div class="card tap" data-act="open" data-id="${m.id}"><div class="chead"><div><div class="nm">${esc(m.fio)}</div>
      <div class="sub">${m.status === 'done' ? 'Завершил адаптацию' : 'Уволился'} ${fmt(m.statusDate)}${m.statusReason ? ', ' + esc(m.statusReason) : ''}</div></div>
      <div class="num"><b>${worked(m)}</b><span>смен</span></div></div></div>`).join('')}</details>`;
  }
  h += `<div class="sign">${esc(SIGN)}</div>`;
  return h;
}

function viewMentee(m){
  const tabs = [['shifts','Смены'],['skills','Обучение'],['meet','Беседы'],['data','Данные']];
  let h = `<div class="card">
    <div class="chead"><div><div class="nm">${esc(m.fio)}</div>
      <div class="sub">${m.tab ? 'Таб. ' + esc(m.tab) + ', ' : ''}принят ${fmt(m.hireDate)}</div>
      <div class="sub">${esc(GNAME[m.mainGroup])}${m.groups.length > 1 ? ' + ' + m.groups.filter(g => g !== m.mainGroup).map(g => GNAME[g]).join(', ') : ''}</div></div>
      <div class="num"><b>${worked(m)}</b><span>${plural(worked(m),'смена','смены','смен')}<br>отработано</span></div></div>
    ${ladderHtml(m)}
    ${m.status !== 'active' ? `<div class="chips"><span class="chip ${m.status==='done'?'ok':'bad'}">${m.status==='done'?'Завершил адаптацию':'Уволился'} ${fmt(m.statusDate)}</span></div>` : riskHtml(m) + flagsHtml(m) + taskHtml(m)}
  </div>
  <div class="tabs" role="tablist">${tabs.map(([k, t]) => `<button role="tab" data-act="tab" data-v="${k}" class="${ui.tab===k?'on':''}">${t}</button>`).join('')}</div>`;

  if (ui.tab === 'skills') h += tabSkills(m);
  else if (ui.tab === 'meet') h += tabMeet(m);
  else if (ui.tab === 'data') h += tabData(m);
  else h += tabShifts(m);
  return h;
}

function tabShifts(m){
  let h = m.status === 'active' ? `<div class="row" style="margin-bottom:14px"><button class="btn main" data-act="noteNew" data-id="${m.id}">Отметить смену</button></div>` : '';
  // Выработка: все смены с целью, до которых новичок дошёл, — можно вписать и задним числом
  const cur = curShiftNo(m), ro = m.status !== 'active' ? 'disabled' : '';
  const ks = Object.keys(OUTPUT_GOAL).filter(k => cur >= +k || m.output[k] !== undefined);
  if (ks.length) h += `<div class="card"><b>Выработка</b>${ks.map(k => {
    const g = OUTPUT_GOAL[k], v = m.output[k];
    return `<label class="f" style="margin:10px 0 0"><span>${k}-я смена, коробов (цель ${goalText(g)})</span>
      <input type="number" min="0" max="9999" inputmode="numeric" placeholder="Впишите число" data-out="${k}" data-id="${m.id}" value="${v === undefined ? '' : v}" ${ro}></label>
      <div data-outst="${k}">${outStatus(k, v)}</div>`;
  }).join('')}</div>`;
  const ns = sortedNotes(m);
  if (!ns.length) return h + `<div class="empty"><p>Отметок пока нет. После каждой смены нажмите «Отметить смену» — это занимает полминуты.</p></div>`;
  if (m.shiftsBefore) h += `<p class="muted small">До начала записей отработал смен: ${m.shiftsBefore}</p>`;
  for (const n of ns){
    const [y, mo, d] = n.date.split('-');
    h += `<div class="card tap" data-act="noteEdit" data-id="${m.id}" data-n="${n.id}"><div class="hist">
      <div class="dt"><b>${+d}</b><span>${MON[+mo-1]}</span></div>
      <div class="bd">
        <div>${n.present ? `<b>${SCORE_IC[n.score] || ''} ${SCORE[n.score] || 'Без оценки'}</b>` : '<b>Не вышел на смену</b>'}</div>
        ${n.present ? (() => { const no = shiftOnDate(m, n.date), v = m.output[no];
          return `<div class="small muted">${no}-я смена${v !== undefined ? ` · 📦 ${v} кор.` : ''}</div>`; })() : ''}
        ${n.tags && n.tags.length ? `<div class="chips">${n.tags.map(t => `<span class="chip ${tagChipCls(t)}">${tagSign(t) > 0 ? '✓ ' : tagSign(t) < 0 ? '⚠ ' : ''}${esc(t)}</span>`).join('')}</div>` : ''}
        ${n.comment ? `<p>${esc(n.comment)}</p>` : ''}
        ${n.nextSkill || n.nextText ? `<p class="small muted">📌 ${esc([findSkill(n.nextSkill)?.name, n.nextText].filter(Boolean).join('. '))}</p>` : ''}
        ${n.help ? `<div class="chips"><span class="chip ${n.helpResolved ? 'ok' : 'bad'}">${n.helpResolved ? 'Помощь: вопрос решён' : '🚨 ' + helpTitle(n)}</span></div>
          ${n.helpText ? `<p class="small muted">${esc(n.helpText)}</p>` : ''}
          ${!n.helpResolved ? `<div class="row" style="margin-top:8px"><button class="btn sm" data-act="helpResolve" data-id="${m.id}" data-n="${n.id}">Вопрос решён</button></div>` : ''}` : ''}
      </div></div></div>`;
  }
  return h;
}

/* Раздел открыт: если пользователь не переключал — открыт, пока не выполнен; выполненный сворачивается сам */
function secOpen(key, done){ return ui.secOpen && key in ui.secOpen ? ui.secOpen[key] : !done; }
function secHead(key, title, done, count, extra){
  const open = secOpen(key, done);
  return { open, html: `<button class="sechead" data-act="secToggle" data-k="${key}" data-done="${done ? 1 : 0}" aria-expanded="${open}">
    <b>${done ? '✅ ' : ''}${esc(title)}</b><span class="muted small">${count}${extra || ''} <span class="caret">${open ? '▾' : '▸'}</span></span></button>` };
}
function checkSection(m, sec, carry, ro){
  const vis = sec.items.filter(it => itemOn(m, sec, it));   // пункты «со 2-й смены» и т.п. до своей смены скрыты
  if (!vis.length) return '';
  const left = vis.filter(it => !obItemDone(m, it)).length, done = obSectionLeft(m, sec) === 0, key = m.id + ':' + sec.id;
  const hd = secHead(key, sec.name, done, `${vis.length - left}/${vis.length}`, done ? ' · ' + fmt(secDoneDate(m, sec)).slice(0, 5) : '');
  let h = `<div class="card obsec">` + hd.html;
  if (hd.open){
    if (sec.goal) h += `<p class="muted small" style="margin:0 0 6px"><b>Цель:</b> ${esc(sec.goal)}</p>`;
    for (const it of vis){
      const ok = obItemDone(m, it), carried = carry && !ok;
      const label = `<span class="obn">${it.n}</span><span class="obtx">${esc(it.t)}${carried ? ' <span class="obcarry">перенесено</span>' : ''}</span>`;
      if (it.sub){
        h += `<div class="obrow ${ok ? 'ok' : ''}"><span class="obmark" aria-hidden="true">${ok ? '✓' : ''}</span>
          <div class="obbody"><div class="obt">${label}</div>
          <div class="obchips">${it.sub.map(su => `<button data-act="obTap" data-id="${m.id}" data-u="${su.id}" class="${m.onboard[su.id] ? 'on' : ''}" title="${esc(su.f)}" ${ro}>${m.onboard[su.id] ? '✓ ' : ''}${esc(su.t)}</button>`).join('')}</div></div>
          <button class="obinfo" data-act="obInfo" data-u="${it.id}" aria-label="Подробнее">ⓘ</button></div>
          <div class="obfull" id="obf_${it.id}" hidden>${esc(it.f)}: ${it.sub.map(su => esc(su.f)).join('; ')}</div>`;
      } else {
        // пункт-беседа (meet) отмечается сам по записанной беседе, касание ведёт во вкладку «Беседы»
        const act = it.meet ? `data-act="tab" data-v="meet"` : `data-act="obTap" data-id="${m.id}" data-u="${it.id}" ${ro}`;
        const sub = ok ? fmt(itemDate(m, it)) : it.meet ? 'Запишите во вкладке «Беседы» →' : '';
        h += `<div class="obrow ${ok ? 'ok' : ''}"><button class="obmark" ${act} aria-pressed="${ok}" aria-label="${esc(it.f)}">${ok ? '✓' : ''}</button>
          <button class="obbody obtap" ${act}><div class="obt">${label}</div>${sub ? `<div class="obd">${sub}</div>` : ''}</button>
          ${it.q ? '' : `<button class="obinfo" data-act="obInfo" data-u="${it.id}" aria-label="Подробнее">ⓘ</button>`}</div>
          <div class="obfull" id="obf_${it.id}" ${it.q ? '' : 'hidden'}>${esc(it.f)}${it.q ? `<ul class="obq">${it.q.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}</div>`;   // с вопросами (q) — всегда развёрнуто
      }
    }
    if (vis.some(it => !it.meet && !obItemDone(m, it)) && !ro) h += `<div class="row" style="margin-top:8px"><button class="btn sm ghost" data-act="obAll" data-id="${m.id}" data-s="${sec.id}">Отметить весь раздел</button></div>`;
  }
  return h + `</div>`;
}
function tabSkills(m){
  const ro = m.status !== 'active' ? 'disabled' : '';
  const cur = curShiftNo(m);
  let h = '';
  if (m.status === 'active'){
    const ln = lastNote(m), gap = cur > 1 && (!ln || ln.date < isoLocal(Date.parse(shiftDefaultDate()) - 864e5));
    h += `<div class="note" ${gap ? 'style="border-left-color:var(--warn)"' : ''}><b>Сейчас ${cur}-я смена новичка</b>${gap
      ? 'Последняя отметка — ' + (ln ? fmt(ln.date) : 'нет') + '. Если с тех пор были смены, сначала отметьте их во вкладке «Смены»: от номера смены зависят «День 2/3», «Критично» и выработка.'
      : 'Номер считается по отметкам «Вышел». Если он не совпадает — проверьте отметки во вкладке «Смены».'}</div>`;
  }
  h += `<h2 style="margin-top:4px">Старт <span class="muted small" style="font-weight:400">${obTotal - obLeft(m)}/${obTotal}</span></h2>
    <p class="muted small" style="margin:-4px 2px 10px"><b>Цель:</b> ${esc(ONBOARD_GOAL)}</p>`;
  if (!onboardDone(m) && cur > 1) h += `<div class="note" style="border-left-color:var(--warn)"><b>«Старт» не закрыт</b>Не сделано: ${obLeft(m)}. Отметьте на этой смене — без этого не оформить лист допуска.</div>`;
  for (const sec of ONBOARD) h += checkSection(m, sec, cur > 1, ro);
  h += `<h2>Подготовка <span class="muted small" style="font-weight:400">${trTotal - trLeft(m)}/${trTotal}</span></h2>`;
  for (const sec of TRAINING) h += checkSection(m, sec, false, ro);   // открыта с 1-й смены
  const opsVis = OPS.flatMap(sec => sec.items.filter(it => itemOn(m, sec, it)));
  h += `<h2>Обучение операциям <span class="muted small" style="font-weight:400">${opsVis.filter(it => obItemDone(m, it)).length}/${opsVis.length}</span></h2>`;
  for (const sec of OPS) h += checkSection(m, sec, false, ro);
  const crit = SHIFT_CRIT[cur];
  if (m.status === 'active' && crit) h += `<div class="crit"><b>⚠️ Критично на ${cur}-й смене</b><ul>${crit.list.map(t => `<li>${esc(t)}</li>`).join('')}</ul>
    <p><b>${esc(crit.foot[0])}:</b> ${esc(crit.foot[1])}</p></div>`;
  const og = OUTPUT_GOAL[cur];
  if (m.status === 'active' && og){
    const fact = m.output[cur];
    h += `<div class="card"><b>Выработка за ${cur}-ю смену</b>
      <dl class="kv" style="margin:8px 0 12px"><dt>Цель</dt><dd>${goalText(og)} коробов</dd>
        ${cur > 1 ? `<dt>Прошлая смена</dt><dd>${m.output[cur - 1] !== undefined ? m.output[cur - 1] + ' кор.' : 'не вписано'}</dd>` : ''}</dl>
      <label class="f" style="margin:0"><span>Факт выработка, коробов</span><input type="number" min="0" max="9999" inputmode="numeric" placeholder="Впишите число" data-out="${cur}" data-id="${m.id}" value="${fact === undefined ? '' : fact}"></label>
      <div data-outst="${cur}">${outStatus(cur, fact)}</div></div>`;
  }
  for (const g of groupsOf(m)){ const a = admissionBlock(m, g); if (a) h += `<div class="card">${a}</div>`; }
  return h;
}

function admissionBlock(m, g){
  const a = m.admissions[g];
  if (a && a.status === 'confirmed') return `<div class="adm"><span class="chip ok">Допуск подтверждён руководителем ${fmt(a.confirmedDate)}</span></div>`;
  if (a && a.status === 'requested') return `<div class="adm"><div class="chips" style="margin-top:0"><span class="chip info">Лист допуска оформлен ${fmt(a.date)}, ждёт подтверждения</span></div>
    <div class="row"><button class="btn sm" data-act="admShare" data-id="${m.id}" data-g="${g}">Отправить лист</button><button class="btn sm" data-act="admConfirm" data-id="${m.id}" data-g="${g}">Руководитель подтвердил</button></div>
    <div class="row"><button class="btn sm ghost" data-act="admCancel" data-id="${m.id}" data-g="${g}">Отменить лист допуска</button></div></div>`;
  if (m.status !== 'active') return '';
  if (canAdmit(m, g)) return `<div class="adm"><div class="row" style="margin-top:0"><button class="btn main" data-act="admit" data-id="${m.id}" data-g="${g}">Оформить лист допуска</button></div></div>`;
  const early = curShiftNo(m) < ADMIT_SHIFT;
  if (allDone(m) && early) return `<div class="adm small muted">Всё обучение пройдено. Лист допуска можно оформить с ${ADMIT_SHIFT}-й смены.</div>`;
  if (opsDone(m)) return `<div class="adm small muted">«Обучение операциям» пройдено. Для листа допуска осталось закрыть: ${[obLeft(m) ? `«Старт» — ${obLeft(m)}` : '', trLeft(m) ? `«Подготовка» — ${trLeft(m)}` : ''].filter(Boolean).join(', ')}${early ? `. Оформить его можно с ${ADMIT_SHIFT}-й смены` : ''}.</div>`;
  return '';
}
function admissionText(m, g){
  const a = m.admissions[g] || {};
  const lines = [`ЛИСТ ДОПУСКА К САМОСТОЯТЕЛЬНОЙ РАБОТЕ`, ``,
    `Сотрудник: ${m.fio}${m.tab ? ', таб. ' + m.tab : ''}`, `Принят: ${fmt(m.hireDate)}`, `Операции: ${GNAME[g]}`,
    `Отработано смен: ${shiftNoAt(m, a.date || today())}`, ``, `Освоено:`];
  for (const sec of ALL_CHECK){
    let last = ''; for (const it of sec.items) for (const u of (it.sub || [it])) if ((m.onboard[u.id] || '') > last) last = m.onboard[u.id];
    lines.push(`• ${sec.name} — выполнено ${fmt(last)}`);
  }
  lines.push('', `Наставник: ${S.settings.fio || '—'}${S.settings.shift ? ', смена ' + S.settings.shift : ''}`, `Дата: ${fmt(a.date || today())}`);
  if (a.comment) lines.push(`Комментарий: ${a.comment}`);
  lines.push('', 'Наставник считает сотрудника готовым к самостоятельной работе. Решение о допуске принимает руководитель смены.');
  return lines.join('\n');
}
async function shareText(t, okMsg){
  if (navigator.share){ try { await navigator.share({ text: t }); return; } catch(e){ if (e && e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(t); toast(okMsg || 'Текст скопирован — вставьте его в чат'); }
  catch(e){ const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('Текст скопирован'); }
}

function tabMeet(m){
  const cur = curShiftNo(m);
  let h = `<p class="muted small" style="margin-top:0">Короткие беседы один на один: как дела, что получается, что мешает. Итоги увидит руководитель смены.</p>`;
  for (const k of MEET){
    const mt = m.meetings[k];
    let st;
    if (mt && mt.done) st = `<span class="chip ok">Проведена ${fmt(mt.date)}</span>`;
    else if (cur === k) st = `<span class="chip warn">Сегодня — пора провести</span>`;
    else if (cur > k) st = `<span class="chip warn">Пора провести</span>`;
    else st = `<span class="chip">Через ${k - cur} ${plural(k - cur,'смену','смены','смен')}</span>`;
    const ans = mt && mt.answers ? SURVEY.filter(([id]) => mt.answers[id]).map(([id, q]) => `<div class="ans"><span>${esc(q)}</span><b class="${mt.answers[id] <= 2 ? 'low' : ''}">${SURVEY_SCALE[mt.answers[id]]}</b></div>`).join('') : '';
    h += `<div class="card"><div class="ghead"><b>Беседа на ${k}-й смене</b></div><div class="chips">${st}</div>
      ${ans ? `<div style="margin-top:10px">${ans}</div>` : ''}
      ${mt && mt.comment ? `<p style="white-space:pre-wrap;margin:10px 0 0">${esc(mt.comment)}</p>` : ''}
      ${m.status === 'active' || (mt && mt.done) ? `<div class="row" style="margin-top:12px"><button class="btn sm ${mt && mt.done ? '' : 'main'}" data-act="meet" data-id="${m.id}" data-k="${k}">${mt && mt.done ? 'Изменить итоги' : 'Записать итоги'}</button></div>` : ''}
    </div>`;
  }
  return h;
}

function groupPickers(sel, main){
  if (WORK_GROUPS.length === 1) return `<input type="hidden" name="mainGroup" value="${WORK_GROUPS[0][0]}">`;
  return `<label class="f"><span>Основная группа операций</span><select name="mainGroup">${WORK_GROUPS.map(([g, n]) => `<option value="${g}" ${main===g?'selected':''}>${n}</option>`).join('')}</select></label>
  <div class="f"><span class="muted small" style="display:block;margin-bottom:6px">Ещё обучается (необязательно)</span>
  ${WORK_GROUPS.map(([g, n]) => `<label class="check"><input type="checkbox" name="g_${g}" ${sel.includes(g) && g !== main ? 'checked' : ''}><span>${n}</span></label>`).join('')}</div>`;
}

function menteeForm(m){
  m = m || { fio:'', tab:'', hireDate:'', mainGroup:'pick', groups:['pick'], shiftsBefore:0 };
  return `<label class="f"><span>ФИО</span><input type="text" name="fio" value="${esc(m.fio)}" autocomplete="off" autocapitalize="words"></label>
    <label class="f"><span>Табельный номер</span><input type="text" name="tab" value="${esc(m.tab)}" inputmode="numeric" autocomplete="off"></label>
    <label class="f"><span>Дата приёма</span><input type="date" name="hireDate" value="${esc(m.hireDate)}" max="${today()}"></label>
    ${groupPickers(m.groups, m.mainGroup)}
    <label class="f"><span>Смен уже отработано до начала записей</span><input type="number" name="shiftsBefore" value="${m.shiftsBefore || 0}" min="0" max="200" inputmode="numeric"></label>`;
}

function tabData(m){
  let h = `<div class="card"><form id="mform" onsubmit="return false">${menteeForm(m)}
    <button class="btn main wide" data-act="menteeSave" data-id="${m.id}">Сохранить изменения</button></form></div>`;
  if (m.status === 'active'){
    h += `<div class="row"><button class="btn" data-act="status" data-id="${m.id}" data-v="done">✅ Завершил адаптацию</button>
      <button class="btn" data-act="status" data-id="${m.id}" data-v="left">🚪 Уволился</button></div>`;
  } else {
    h += `<div class="card"><dl class="kv"><dt>Статус</dt><dd>${m.status === 'done' ? 'Завершил адаптацию' : 'Уволился'}</dd>
      <dt>Дата</dt><dd>${fmt(m.statusDate)}</dd>${m.statusReason ? `<dt>Причина</dt><dd>${esc(m.statusReason)}</dd>` : ''}
      ${m.statusComment ? `<dt>Комментарий</dt><dd>${esc(m.statusComment)}</dd>` : ''}</dl></div>
      <div class="row"><button class="btn" data-act="reactivate" data-id="${m.id}">Вернуть в работу</button></div>`;
  }
  h += `<div class="row" style="margin-top:22px"><button class="btn danger" data-act="menteeDelete" data-id="${m.id}">Удалить из приложения</button></div>
    <p class="muted small">Удаление стирает записи только на этом телефоне. То, что уже отправлено руководителю, у него сохранится.</p>`;
  return h;
}

function viewStats(){
  const all = S.mentees;
  if (!all.length) return `<div class="empty"><div class="big">📊</div><p>Итоги появятся, когда вы добавите новичков и начнёте отмечать смены.</p></div>`;
  const act = all.filter(m => m.status === 'active'), done = all.filter(m => m.status === 'done'), left = all.filter(m => m.status === 'left');
  const reached = all.filter(m => worked(m) >= 14 || m.status === 'done').length;
  const lostEarly = left.filter(m => worked(m) < 14).length;
  const base = reached + lostEarly;
  const ret = base ? Math.round(reached / base * 100) : null;
  let h = `<div class="stats">
    <div class="stat"><b>${all.length}</b><span>всего новичков</span></div>
    <div class="stat"><b>${act.length}</b><span>сейчас обучаются</span></div>
    <div class="stat"><b>${done.length}</b><span>завершили адаптацию</span></div>
    <div class="stat"><b>${left.length}</b><span>уволились</span></div>
    <div class="stat wide"><b>${ret === null ? '—' : ret + '%'}</b><span>${base ? `удержание до 14-й смены: ${reached} из ${base}` : 'удержание до 14-й смены — пока никто не дошёл до итога'}${base && base < 5 ? '. Данных пока мало, цифра неточная' : ''}</span></div>
  </div>`;

  // Выработка: средняя по новичкам за каждую смену, по сменам с целью — сколько её достигли
  const outKs = [...new Set(all.flatMap(m => Object.keys(m.output).map(Number)))].sort((a, b) => a - b).slice(0, 14);
  if (outKs.length){
    h += `<h2>Выработка</h2><div class="card"><p class="small muted" style="margin:0 0 4px">Средняя по новичкам, коробов за смену.</p>`;
    for (const k of outKs){
      const v = all.map(m => m.output[k]).filter(x => x !== undefined), g = OUTPUT_GOAL[k];
      h += `<div class="ans"><span>${k}-я смена${g ? ` <span class="muted">· цель ${goalText(g)}</span>` : ''}</span>
        <b>${Math.round(avg(v))}${g ? ` · достигли ${v.filter(x => x >= g[0]).length} из ${v.length}` : ` · ${v.length} чел.`}</b></div>`;
    }
    h += `</div>`;
  }

  // Где застревают: пункт закрыт позже своей смены или открыт и до сих пор не закрыт
  const late = [];
  for (const sec of ALL_CHECK) for (const u of gridUnits(sec)){
    const due = dueShiftOf(sec, u.it); let n = 0, base = 0;
    for (const m of all){
      if (m.shiftsBefore) continue;   // пришёл не с 1-й смены — сроки по нему не показательны
      const d = m.onboard[u.id];
      if (d){ base++; if (shiftOnDate(m, d) > due) n++; }
      else if (m.status === 'active' && curShiftNo(m) > due){ base++; n++; }
    }
    if (n) late.push({ t: u.t, n, base });
  }
  if (late.length){
    late.sort((a, b) => b.n - a.n || b.n / b.base - a.n / a.base);
    h += `<h2>Где застревают</h2><div class="card"><p class="small muted" style="margin:0 0 4px">Пункты, которые закрыли позже своей смены или не закрыли до сих пор: у скольких новичков из тех, кто до них дошёл.</p>
      ${late.slice(0, 7).map(x => `<div class="ans"><span>${esc(x.t)}</span><b>${x.n} из ${x.base}</b></div>`).join('')}</div>`;
  }

  // Допуски
  const adm = [];
  for (const m of all) for (const [g] of WORK_GROUPS){ const a = m.admissions[g]; if (a) adm.push({ g, n: shiftNoAt(m, a.date), st: a.status }); }
  h += `<h2>Допуски</h2><div class="card">`;
  if (!adm.length) h += `<p class="muted small" style="margin:0">Листов допуска пока нет.</p>`;
  else {
    h += `<dl class="kv"><dt>Оформлено листов</dt><dd>${adm.length}</dd><dt>Подтверждено</dt><dd>${adm.filter(a => a.st === 'confirmed').length}</dd></dl>`;
    for (const [g, name] of WORK_GROUPS){
      const xs = adm.filter(a => a.g === g); if (!xs.length) continue;
      h += `<div class="ans"><span>${esc(name)}: в среднем к смене</span><b>${Math.round(avg(xs.map(a => a.n)))}</b></div>`;
    }
  }
  h += `</div>`;

  // Беседы
  let due = 0, held = 0, onTime = 0, checkable = 0;
  for (const m of all){
    const first = m.notes.map(n => n.date).sort()[0];
    for (const k of MEET){
      if (worked(m) < k) continue; due++;
      const mt = m.meetings[k]; if (!mt || !mt.done) continue; held++;
      // если смены до начала записей не датированы, номер смены на дату беседы неизвестен
      if (m.shiftsBefore && (!first || mt.date < first)) continue;
      checkable++; if (shiftNoAt(m, mt.date) <= k + 1) onTime++;
    }
  }
  h += `<h2>Беседы</h2><div class="card"><dl class="kv"><dt>Положено провести</dt><dd>${due}</dd><dt>Проведено</dt><dd>${held}</dd>
    <dt>Вовремя</dt><dd>${checkable ? `${onTime} из ${checkable}` : '—'}</dd></dl>
    <p class="small muted" style="margin:8px 0 0">«Вовремя» — не позже следующей смены после положенной. Считается только по беседам, для которых есть отметки смен.</p></div>`;

  // Ответы новичков
  const qs = SURVEY.map(([id, q]) => { const v = []; for (const m of all) for (const k of MEET){ const a = m.meetings[k]?.answers?.[id]; if (a) v.push(a); } return { q, v }; });
  if (qs.some(x => x.v.length)){
    h += `<h2>Что говорят новички</h2><div class="card"><p class="small muted" style="margin:0 0 4px">Средний ответ по всем беседам, из 5.</p>`;
    for (const { q, v } of qs){
      if (!v.length) continue; const a = avg(v);
      h += `<div class="hbar"><div class="lbl"><span>${esc(q)}</span><b>${a.toFixed(1)}</b></div><div class="bar"><span class="${a < 3 ? 'b' : a < 4 ? 'w' : ''}" style="width:${a / 5 * 100}%"></span></div></div>`;
    }
    h += `</div>`;
  }

  // Смены за 30 дней
  const from = isoLocal(Date.now() - 30 * 864e5);
  const ns = all.flatMap(m => m.notes.filter(n => n.date >= from));
  const sc = ns.filter(n => n.present && n.score).map(n => n.score);
  h += `<h2>Последние 30 дней</h2><div class="card"><dl class="kv"><dt>Отметок о сменах</dt><dd>${ns.length}</dd>
    <dt>Невыходов</dt><dd>${ns.filter(n => !n.present).length}</dd><dt>Средняя оценка смены</dt><dd>${sc.length ? avg(sc).toFixed(1) + ' из 5' : '—'}</dd></dl></div>`;

  // Увольнения
  if (left.length){
    const reasons = {}; left.forEach(m => { const r = m.statusReason || 'Не указана'; reasons[r] = (reasons[r] || 0) + 1; });
    h += `<h2>Увольнения</h2><div class="card"><dl class="kv"><dt>В среднем на смене</dt><dd>${Math.round(avg(left.map(worked)))}</dd></dl><div style="margin-top:8px">
      ${Object.entries(reasons).sort((a, b) => b[1] - a[1]).map(([r, c]) => `<div class="ans"><span>${esc(r)}</span><b>${c}</b></div>`).join('')}</div></div>`;
  }
  h += `<div class="sign">${esc(SIGN)}</div>`;
  return h;
}

function obCancelAdmissions(m){

  if (req.length){ req.forEach(g => delete m.admissions[g]); toast('Лист допуска отменён: не все пункты обучения отмечены'); }
}
function closeSheet(){

}

      <label class="f"><span id="nOutCap">Выработка, коробов</span><input type="number" id="nOut" min="0" max="9999" inputmode="numeric" placeholder="Впишите число, если знаете"></label>

    <div class="f"><span class="muted small" style="display:block;margin-bottom:6px">Комментарий</span>
      <textarea id="nComment" class="grow" rows="1" maxlength="${COMMENT_MAX}" placeholder="${n.present ? 'Коротко: что получилось, что нет' : 'Причина, если известна'}">${esc(n.comment)}</textarea>

/* Номер смены, к которой относится отметка: смены до записей + отмеченные выходы раньше этой даты + эта */
function noteShiftNo(m, n, date){
  return (+m.shiftsBefore || 0) + m.notes.filter(x => x.present && x.id !== n.id && x.date < date).length + 1;
}
function tagMin(d){ return d.min !== undefined ? d.min : (TAG_GROUP_MIN[d.g] || 0); }
function tagAllowed(d, no){ return no >= tagMin(d); }
function tagChip(d, n, more){
  const on = n.tags.includes(d.t), full = !on && n.tags.length >= MAX_TAGS;
  const cls = d.s > 0 ? 'pos' : d.s < 0 ? 'neg' : 'neu';
  return `<button data-act="nTag" data-v="${esc(d.t)}" class="tg ${cls} ${on ? 'on' : ''}" ${full ? 'aria-disabled="true"' : ''} aria-pressed="${on}">${d.s > 0 ? '✓ ' : d.s < 0 ? '⚠ ' : ''}${esc(d.t)}${more && d.hint ? `<small>${esc(d.hint)}</small>` : ''}</button>`;
}
function refreshNoteTags(){
  if (!sheet || sheet.kind !== 'note') return;
  const m = findM(sheet.mid), n = sheet.note, date = $('#nDate').value || n.date;
  const no = noteShiftNo(m, n, date);
  sheet.shiftNo = no;
  const cap = $('#nShiftCap'); if (cap) cap.textContent = `Как прошла ${no}-я смена`;
  const oc = $('#nOutCap'); if (oc) oc.textContent = `Выработка за ${no}-ю смену, коробов${OUTPUT_GOAL[no] ? ` (цель ${goalText(OUTPUT_GOAL[no])})` : ''}`;
  const box = $('#nTags'); if (!box) return;
  $('#nTagCap').textContent = `${n.tags.length}/${MAX_TAGS}`;
  if (!n.present){
    box.innerHTML = `<div class="tagset">${TAG_DEFS.filter(d => d.absent).map(d => tagChip(d, n, false)).join('')}</div>`;
    return;
  }
  const core = TAG_DEFS.filter(d => d.core && !d.absent && tagAllowed(d, no));
  const known = new Set(core.map(d => d.t));
  let h = `<div class="tagset">${core.map(d => tagChip(d, n, false)).join('')}`;
  if (!sheet.more) h += n.tags.filter(t => !known.has(t)).map(t => tagChip(TAG_MAP[t] || { t, s: tagSign(t) }, n, false)).join('');
  h += `</div>`;
  if (sheet.more){
    for (const [g, label, min] of TAG_GROUPS){
      const defs = TAG_DEFS.filter(d => d.g === g && !d.core && !d.absent);
      if (!defs.length) continue;
      if (no < min){ h += `<div class="tgh">${esc(label)} <span class="muted">— с ${min}-й смены</span></div>`; continue; }
      h += `<div class="tgh">${esc(label)}</div><div class="tagset">${defs.map(d => tagChip(d, n, true)).join('')}</div>`;
    }
    const legacy = n.tags.filter(t => !TAG_MAP[t]);
    if (legacy.length) h += `<div class="tagset" style="margin-top:10px">${legacy.map(t => tagChip({ t, s: tagSign(t) }, n, false)).join('')}</div>`;
    const soon = TAG_DEFS.filter(d => d.core && !d.absent && !tagAllowed(d, no));

function helpSignal(){
  try { if (navigator.vibrate) navigator.vibrate(50); } catch(e) {}
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const ctx = helpSignal.ctx || (helpSignal.ctx = new AC());
    if (ctx.state === 'suspended') ctx.resume();
    const o = ctx.createOscillator(), g = ctx.createGain(), t0 = ctx.currentTime;
    o.type = 'sine'; o.frequency.setValueAtTime(1046, t0);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
    o.connect(g); g.connect(ctx.destination); o.start(t0); o.stop(t0 + 0.36);
  } catch(e) {}
}

async function shareFile(name, obj, title){

    try { await navigator.share({ files: [file], title }); return 'shared'; }

/* ---------- «Сводка текстом»: подробно и живым языком ----------
   Факты те же, а формулировки выбираются из вариантов. Выбор зависит от наставника, даты и номера варианта,
   поэтому сводки разных наставников и разных дней не одинаковые, а повторное открытие в тот же день даёт тот же текст */
function hashStr(s){ let h = 2166136261; for (const c of String(s)) h = Math.imul(h ^ c.codePointAt(0), 16777619); return h >>> 0; }

}
const SUM = {
  head:    ['Отчёт наставника', 'Итоги смены по новичкам', 'Сводка по обучению новичков', 'Как прошла смена у новичков', 'Новички: итоги смены'],

  prog:    ['Прогресс по обучению', 'Обучение в целом', 'По чек-листам', 'Где сейчас по программе'],
  left:    ['Впереди', 'Ещё не закрыто', 'Осталось пройти', 'Дальше по программе'],
  next:    ['План на следующую смену', 'Завтра отрабатываем', 'Следующий шаг', 'Дальше делаем упор на'],
  meetDue: ['Пора провести беседу', 'Запланирована беседа', 'Нужно поговорить один на один —'],
  meetOk:  ['Беседа проведена', 'Поговорили один на один', 'Провели беседу'],

function textSummary(variant){
  const st = S.settings, d = shiftDefaultDate();
  const R = seededRandom(hashStr((st.fio || '') + '|' + d + '|' + (variant || 0)));
  const pick = arr => arr[Math.floor(R() * arr.length)];
  const lc = s => s.charAt(0).toLowerCase() + s.slice(1);
  const act = S.mentees.filter(x => x.status === 'active').sort((a, b) => a.fio.localeCompare(b.fio, 'ru'));
  const marked = act.filter(m => m.notes.some(n => n.date === d)), unmarked = act.filter(m => !m.notes.some(n => n.date === d));
  const out = [];
  const hello = pick(SUM.hello); if (hello) out.push(hello);
  out.push(`${pick(SUM.head)} за ${fmt(d)}${st.fio ? ' — ' + shortFio(st.fio) : ''}${st.shift ? ', смена ' + st.shift : ''}.`);
  out.push(`Новичков в обучении: ${act.length}${unmarked.length && marked.length ? `, отмечено за смену: ${marked.length}` : ''}.`);

  for (const m of marked){
    const n = m.notes.find(x => x.date === d), no = shiftOnDate(m, d), lines = [];
    lines.push(`\n▪️ ${m.fio} — ${no}-я смена${no <= 3 ? ` (день ${no} обучения)` : `, ${lc(stageOf(worked(m)))}`}`);
    if (!n.present){
      lines.push(`${pick(SUM.absent)}${(n.tags || []).length ? ` (${n.tags.map(lc).join(', ')})` : ''}${n.comment ? ': ' + n.comment : '.'}`);
    } else {
      if (SCORE[n.score]) lines.push(`${pick(SUM.shiftOk)}: ${lc(SCORE[n.score])}.`);
      const good = (n.tags || []).filter(t => tagSign(t) > 0), bad = (n.tags || []).filter(t => tagSign(t) <= 0);
      const notes = [];
      if (good.length) notes.push(`${pick(SUM.good)}: ${good.map(lc).join(', ')}.`);
      if (bad.length) notes.push(`${pick(SUM.bad)}: ${bad.map(lc).join(', ')}.`);
      if (R() < 0.5) notes.reverse();   // порядок плюсов и замечаний тоже меняется
      lines.push(...notes);
      if (n.comment) lines.push(`${pick(SUM.comment)}: ${n.comment}`);
      const v = m.output[no], g = OUTPUT_GOAL[no];
      if (v !== undefined) lines.push(`${pick(SUM.out)}: ${v} кор.${g ? (v >= g[0] ? ` — ${pick(SUM.outOk)} (${goalText(g)})` : ` — ${pick(SUM.outLow)} ${g[0] - v} кор. (цель ${goalText(g)})`) : ''}`);
      // отмеченное в эту смену: пункты этой смены — «закрыли за смену»,
      // пункты, положенные на прошлые смены (дозаполнили задним числом или перенесли), — отдельно
      const done = { cur: [[], []], late: [[], []] };   // [список, по разделам]
      for (const sec of ALL_CHECK){
        const c = { cur: 0, late: 0 };
        for (const it of sec.items){
          if (it.meet) continue;
          const k = dueShiftOf(sec, it) < no ? 'late' : 'cur';
          if (it.sub){ const su = it.sub.filter(u => m.onboard[u.id] === d); if (su.length){ done[k][0].push(`${it.t} (${su.map(u => u.t).join(', ')})`); c[k]++; } }
          else if (m.onboard[it.id] === d){ done[k][0].push(it.t); c[k]++; }
        }
        for (const k of ['cur', 'late']) if (c[k]) done[k][1].push(`«${sec.name}» — ${c[k]} ${plural(c[k], 'пункт', 'пункта', 'пунктов')}`);
      }
      // немного пунктов — списком, много — по разделам, чтобы сообщение не растягивалось
      const listOf = ([xs, bySec]) => xs.length <= 6 ? xs.join('; ') : bySec.join(', ');
      if (done.cur[0].length) lines.push(`${pick(SUM.done)}: ${listOf(done.cur)}.`);
      if (done.late[0].length) lines.push(`${pick(SUM.late)}: ${listOf(done.late)}.`);
    }
    // общий прогресс и что впереди
    const opsVis = OPS.flatMap(sec => sec.items.filter(it => itemOn(m, sec, it)));
    const parts = [`«Старт» ${obTotal - obLeft(m)}/${obTotal}`];
    parts.push(`«Подготовка» ${trTotal - trLeft(m)}/${trTotal}`);
    parts.push(`«Обучение операциям» ${opsVis.filter(it => obItemDone(m, it)).length}/${opsVis.length}`);
    lines.push(`${pick(SUM.prog)}: ${parts.join(', ')}.`);
    const ahead = [...ONBOARD, ...TRAINING, ...OPS].flatMap(sec => sec.items.filter(it => itemOn(m, sec, it) && !obItemDone(m, it)));
    if (ahead.length) lines.push(`${pick(SUM.left)}: ${ahead.slice(0, 3).map(it => it.t).join('; ')}${ahead.length > 3 ? ` (всего ${ahead.length})` : ''}.`);
    // задача на следующую смену — из сегодняшней отметки, иначе последняя незакрытая
    const nt = nextTask(m), nextTxt = (n.nextText || '').trim() || (nt ? [nt.name, nt.text].filter(Boolean).join('. ') : '');
    if (nextTxt) lines.push(`${pick(SUM.next)}: ${nextTxt}`);
    const mt = MEET.map(k => [k, m.meetings[k]]).find(([, x]) => x && x.done && x.date === d);
    if (mt){
      const low = SURVEY.filter(([id]) => mt[1].answers[id] && mt[1].answers[id] <= 2).map(([, q]) => lc(q));
      lines.push(`${pick(SUM.meetOk)} (${mt[0]}-я смена)${low.length ? `. Обратить внимание: ${low.join('; ')}` : ', тревожных ответов нет'}.`);
    } else { const k = meetingDue(m); if (k) lines.push(`${pick(SUM.meetDue)} ${k}-й смены.`); }
    // помощь: из сегодняшней отметки (даже если уже решена) и незакрытые просьбы прошлых смен
    if (n.help) lines.push(`🚨 ${helpTitle(n)}${n.helpText ? ': ' + n.helpText : ''}${n.helpResolved ? ' — вопрос уже решён' : ''}`);
    for (const h of openHelp(m)) if (h.id !== n.id) lines.push(`🚨 ${helpTitle(h)} (с ${fmt(h.date).slice(0, 5)})${h.helpText ? ': ' + h.helpText : ''}`);
    const rr = riskReasons(m); if (rr.length) lines.push(`🔻 Риск ухода: ${rr.join(', ')}.`);
    for (const [g] of WORK_GROUPS) if (m.admissions[g] && m.admissions[g].status === 'requested') lines.push(`✅ Оформлен лист допуска: ${GNAME[g]} (от ${fmt(m.admissions[g].date)}) — нужно ваше подтверждение.`);
    out.push(lines.join('\n'));
  }
  if (unmarked.length) out.push(`\n${pick(SUM.noMark)}: ${unmarked.map(m => `${shortFio(m.fio)} (${curShiftNo(m)}-я смена)`).join(', ')}.`);
  if (!act.length) out.push('\nАктивных новичков нет.');
  const bye = pick(SUM.bye);
  out.push(`\n${bye ? bye + '\n' : ''}— ${st.fio ? shortFio(st.fio) : 'наставник'}${st.shift ? ', смена ' + st.shift : ''}`);
  return out.join('\n');
}

/* Отчёт кодом: тот же отчёт, сжатый и записанный текстом — для почты или если файлы не доходят до рабочего ПК */
async function reportCode(list){
  let bytes = new TextEncoder().encode(JSON.stringify(reportPayload(list, false))), prefix = 'НАСТАВНИК1:';
  if (typeof CompressionStream !== 'undefined'){
    try { const r = new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'))); bytes = new Uint8Array(await r.arrayBuffer()); prefix = 'НАСТАВНИК1Z:'; } catch(e) {}
  }
  let bin = ''; for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  return prefix + btoa(bin);
}
