  const list = unsent();
  if (!list.length){ toast('Нет изменений для отправки'); return; }
  const startedAt = Date.now(), code = await reportCode(list);
  openSheet(`<h3>Отчёт кодом</h3><p class="lead">${list.length} ${plural(list.length,'новичок','новичка','новичков')}, ${code.length} знаков</p>
    ${code.length > 4000 ? `<div class="note" style="border-left-color:var(--warn)">Код длинный: Telegram и WhatsApp разобьют его на несколько сообщений, и он не загрузится. Отправьте его по почте или кнопкой «Отправить отчёт за смену» (файлом).</div>` : ''}
    <textarea readonly style="min-height:120px;font-family:monospace;font-size:12px" onclick="this.select()">${esc(code)}</textarea>
    <p class="small muted">Руководитель смены вставит этот текст в «Паспорте смены»: Данные → Отчёты наставников → «Загрузить из текста».</p>
    <div class="actions"><button class="btn" data-act="codeCopy">Скопировать</button><button class="btn main" data-act="codeShare">Поделиться</button></div>`,
    { kind: 'code', code, startedAt, count: list.length });
}
function markSent(startedAt, count){
  S.lastSentAt = startedAt; S.sentLog.push({ ts: startedAt, count }); S.sentLog = S.sentLog.slice(-30); save();
}

function mergeMentees(list){
  let added = 0, updated = 0;
  for (const raw of list){
    const inc = normMentee(Object.assign({}, raw)); delete inc.calc;
    const ex = S.mentees.find(x => x.id === inc.id) || (inc.tab && S.mentees.find(x => x.tab === inc.tab));
    if (!ex){ S.mentees.push(inc); added++; }
    else if (inc.updatedAt > ex.updatedAt){ Object.assign(ex, inc, { id: ex.id }); updated++; }
  }
  return { added, updated };
}
function importAssignment(d){
  let added = 0, skipped = 0;
  for (const r of (d.mentees || [])){
    const fio = String(r.fio || '').trim(); if (!fio){ skipped++; continue; }
    const tab = String(r.tab || '').trim();
    if (tab && S.mentees.some(x => x.tab === tab)){ skipped++; continue; }
    const main = GNAME[r.mainGroup] && r.mainGroup !== 'common' ? r.mainGroup : 'pick';
    S.mentees.push(normMentee({ id: uid(), fio, tab, hireDate: r.hireDate || '', mainGroup: main, groups: [main], shiftsBefore: +r.shiftsWorked || +r.shiftsBefore || 0 }));
    added++;
  }
  if (d.leader && !S.settings.leader) S.settings.leader = d.leader;
  return { added, skipped };
}
async function handleFile(text){
  let d;
  try { d = JSON.parse(text); } catch(e){ d = null; }
  if (!d || typeof d !== 'object'){ say('Это не файл наставника. Нужен файл .json из «Карманного наставника» или задание от руководителя смены.'); return; }
  if (d.format === 'pasport-mentor-backup'){
    if (!d.state || typeof d.state !== 'object' || !Array.isArray(d.state.mentees)){ say('Файл копии повреждён — данные на телефоне не изменены.'); return; }
    if (!await ask(`Заменить все данные на телефоне копией от ${fmtTs(Date.parse(d.createdAt))}?\nНовичков в копии: ${(d.state?.mentees || []).length}`)) return;
    localStorage.setItem(KEY, JSON.stringify(d.state)); load(); save(); go('list'); toast('Копия восстановлена'); return;
  }
  if (d.format === 'pasport-mentor-report'){
    const r = mergeMentees(d.mentees || []); save(); go('list');
    toast(`Добавлено: ${r.added}, обновлено: ${r.updated}`); return;
  }
  if (d.format === 'pasport-mentor-assignment'){
    const r = importAssignment(d); save(); go('list');
    toast(`Новичков добавлено: ${r.added}${r.skipped ? ', пропущено (уже есть): ' + r.skipped : ''}`); return;
  }
  say('Файл не распознан. Подходят: полная копия, отчёт наставника или задание от руководителя смены.');
}

    const same = m.notes.find(x => x.date === n.date && x.id !== n.id);
    if (same){
      if (!await ask(`За ${fmt(n.date)} уже есть отметка. Заменить её?`)) return;
      m.notes = m.notes.filter(x => x.id !== same.id);
    }
    if (n.present){   // выработка хранится по номеру смены: m.output[no]
      const raw = $('#nOut').value.trim(), v = parseInt(raw, 10);
      if (raw === '') delete m.output[no]; else if (v >= 0) m.output[no] = Math.min(v, 9999);
    }
    const i = m.notes.findIndex(x => x.id === n.id);
    if (i >= 0) m.notes[i] = n; else m.notes.push(n);
    touch(m); closeSheet(); render();
    const due = meetingDue(m);
    toast(due ? `Сохранено. Пора провести беседу ${due}-й смены` : 'Сохранено');
  },
  noteDel: async () => {
    if (!await ask('Удалить эту отметку?')) return;
    const m = findM(sheet.mid); m.notes = m.notes.filter(x => x.id !== sheet.note.id); touch(m); closeSheet(); render();
  },
  helpResolve: (d, b, e) => { e.stopPropagation(); const m = findM(d.id); const n = m.notes.find(x => x.id === d.n); n.helpResolved = true; n.helpResolvedDate = today(); touch(m); render(); },

  meet: d => {
    const m = findM(d.id), k = d.k, mt = m.meetings[k] || {}, hint = MEET_HINTS[k];
    const answers = Object.assign({}, mt.answers || {});
    openSheet(`<h3>Беседа на ${k}-й смене</h3><p class="lead">${esc(m.fio)}</p>
      <details class="hints" ${mt.done ? '' : 'open'}><summary>Подсказки к беседе</summary><p style="margin:8px 0 0">${esc(hint.focus)}</p>
        <ul class="hq">${hint.q.map(([topic, ask, note]) => `<li class="${note ? 'key' : ''}">${topic ? `<span class="hqt">${esc(topic)}</span>` : ''}<span class="hqa">${esc(ask)}</span>${note ? `<span class="hqn">⚠️ ${esc(note)}</span>` : ''}</li>`).join('')}</ul></details>
      <label class="f"><span>Дата беседы</span><input type="date" id="mDate" value="${mt.date || today()}" max="${today()}"></label>
      <p class="small muted" style="margin:0 0 10px">Опросник: спросите новичка и отметьте его ответ, а не своё мнение.</p>
      ${SURVEY.map(([id, q]) => `<div class="sq"><div>${esc(q)}</div><div class="pick c5 c5n">${[1,2,3,4,5].map(v => `<button data-act="mAns" data-q="${id}" data-v="${v}" class="${answers[id]===v?'on':''}">${v}<small>${SURVEY_SCALE[v]}</small></button>`).join('')}</div></div>`).join('')}
      <label class="f"><span>Итоги: что получается, что мешает, о чём договорились</span><textarea id="mComment" style="min-height:120px">${esc(mt.comment || '')}</textarea></label>
      <div class="actions">${mt.done ? `<button class="btn danger" data-act="meetUndo">Отменить</button>` : ''}<button class="btn main" data-act="meetSave">Сохранить</button></div>`, { kind: 'meet', mid: m.id, k, answers });
  },
  meetSave: async () => {
    const m = findM(sheet.mid), dt = $('#mDate').value;
    if (!dt || dt > today()){ toast('Укажите дату не позже сегодняшней'); return; }
    const missing = SURVEY.filter(([id]) => !sheet.answers[id]).length;
    if (missing && !await ask(`Не отмечено ответов в опроснике: ${missing}. Сохранить так?`)) return;
    m.meetings[sheet.k] = { done: true, date: dt, comment: $('#mComment').value.trim(), answers: sheet.answers }; touch(m); closeSheet(); render();
    const rr = riskReasons(m); toast(rr.length ? 'Беседа записана. Риск ухода: ' + rr.join(', ') : 'Беседа записана');
  },
  mAns: (d, b) => {
    const v = +d.v; sheet.answers[d.q] = sheet.answers[d.q] === v ? 0 : v;
    b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', +x.dataset.v === sheet.answers[d.q]));
  },
  admit: d => {
    const m = findM(d.id), g = d.g;
    const items = ALL_CHECK.map(sec => `<div class="list-item small"><span>✅ ${esc(sec.name)}</span><span class="muted" style="flex:0;white-space:nowrap">${fmt(secDoneDate(m, sec))}</span></div>`).join('');
    openSheet(`<h3>Лист допуска: ${esc(GNAME[g])}</h3><p class="lead">${esc(m.fio)}, отработано смен: ${worked(m)}</p>
      <div class="card" style="padding:6px 12px">${items}</div>
      <label class="f"><span>Дата</span><input type="date" id="aDate" value="${today()}" max="${today()}"></label>
      <label class="f"><span>Комментарий для руководителя (необязательно)</span><textarea id="aComment" placeholder="Например: темп пока ниже нормы, но без ошибок"></textarea></label>
      <p class="small muted">Решение о допуске принимает руководитель смены. После сохранения откроется меню «Поделиться», чтобы отправить ему лист.</p>
      <div class="actions"><button class="btn" data-act="closeSheet">Отмена</button><button class="btn main" data-act="admitSave">Оформить и отправить</button></div>`, { kind: 'admit', mid: m.id, g });
  },
  admitSave: () => {
    const m = findM(sheet.mid), g = sheet.g, dt = $('#aDate').value;
    if (!dt || dt > today()){ toast('Укажите дату не позже сегодняшней'); return; }
    m.admissions[g] = { status: 'requested', date: dt, comment: $('#aComment').value.trim(), requestedAt: Date.now() };
    touch(m); closeSheet(); render();
    shareText(admissionText(m, g), 'Лист допуска скопирован — вставьте его в чат руководителю');
  },
  admShare: d => { const m = findM(d.id); shareText(admissionText(m, d.g), 'Лист допуска скопирован'); },
  admConfirm: async d => {
    const m = findM(d.id), a = m.admissions[d.g];
    if (!await ask(`Руководитель смены подтвердил допуск ${shortFio(m.fio)} к операциям «${GNAME[d.g]}»?`)) return;
    a.status = 'confirmed'; a.confirmedDate = today(); touch(m); render(); toast('Допуск подтверждён');
  },
  admCancel: async d => {
    const m = findM(d.id); if (!await ask('Отменить лист допуска?')) return;
    delete m.admissions[d.g]; touch(m); render();
  },
  meetUndo: async () => { if (!await ask('Отметить беседу как не проведённую?')) return; const m = findM(sheet.mid); delete m.meetings[sheet.k]; if (!allDone(m)) obCancelAdmissions(m); touch(m); closeSheet(); render(); },

  sendReport: () => sendReport(false),
  sendAll: () => sendReport(true),
  sendText,
  sumAgain: () => { sheet.variant++; $('#sumText').value = textSummary(sheet.variant); },
  sumShare: () => shareText($('#sumText').value.trim(), 'Сводка скопирована — вставьте её в чат xRooms'),
  sendCode,
  codeShare: async () => {
    const c = sheet;
    if (navigator.share){
      try { await navigator.share({ text: c.code }); markSent(c.startedAt, c.count); closeSheet(); render(); toast('Отчёт отправлен'); return; }
      catch(e){ if (e && e.name === 'AbortError') return; }
    }
    ACT.codeCopy();
  },
  codeCopy: async () => {
    const c = sheet;
    try { await navigator.clipboard.writeText(c.code); }
    catch(e){ const ta = $('#pane textarea'); ta.select(); document.execCommand('copy'); }
    markSent(c.startedAt, c.count); closeSheet(); render(); toast('Код скопирован — вставьте его в письмо или чат руководителю');
  },

  backup: async () => {
    const res = await shareFile(`наставник_копия_${safeName(shortFio(S.settings.fio))}_${fileStamp()}.json`,
      { format: 'pasport-mentor-backup', version: 1, createdAt: new Date().toISOString(), state: S }, 'Копия: Карманный наставник');
    if (res !== 'cancel') toast(res === 'shared' ? 'Копия отправлена' : 'Копия сохранена в «Загрузки»');
  },
  import: () => { const f = $('#fileIn'); f.value = ''; f.click(); },
  cleanArch: async () => {
    const old = oldArchived(); if (!old.length) return;
    if (!await ask(`Удалить с телефона ${old.length} ${plural(old.length, 'человека', 'человек', 'человек')} из архива? Их данные уже у руководителя, восстановить можно из резервной копии.`)) return;
    const ids = new Set(old.map(m => m.id)); S.mentees = S.mentees.filter(m => !ids.has(m.id)); save(); render(); toast('Архив очищен');
  },
  wipe: async () => {
    if (!await ask('Удалить всех новичков и все записи с этого телефона?')) return;
    if (!await ask('Точно? Восстановить можно будет только из сохранённой копии или отчётов.')) return;
    S = blankState(); save(); go('list'); toast('Данные удалены');
  }
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const fn = ACT[b.dataset.act]; if (!fn) return;
  if (b.tagName === 'BUTTON') e.preventDefault();
  fn(b.dataset, b, e);
});
document.addEventListener('change', e => {
  const out = e.target.dataset && e.target.dataset.out;
  if (out){
    const m = findM(e.target.dataset.id); if (!m) return;
    const v = parseInt(e.target.value, 10);
    if (isNaN(v) || v < 0) delete m.output[out]; else m.output[out] = Math.min(v, 9999);
    // без render(): иначе касание кнопки сразу после ввода «теряется» из-за перерисовки
    touch(m); document.querySelectorAll(`[data-outst="${out}"]`).forEach(el => el.innerHTML = outStatus(out, m.output[out]));
    toast('Выработка сохранена'); return;
  }
  const k = e.target.dataset && e.target.dataset.set; if (!k) return;
  S.settings[k] = e.target.value.trim(); save();
  if (k === 'fio' || k === 'shift') render();
});
/* Поиск: обновляется только список, поле ввода не перерисовывается и не теряет фокус */
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  ui.q = e.target.value; const box = $('#mlist'); if (box) box.innerHTML = listHtml(activeSorted());
});
document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (ask.close) ask.close(); else if (sheet) closeSheet(); });
$('#fileIn').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => handleFile(String(r.result)); r.onerror = () => say('Не удалось прочитать файл'); r.readAsText(f, 'utf-8');
});
window.addEventListener('storage', e => { if (e.key === KEY){ load(); render(); } });

/* ---------- запуск ---------- */
load();
render();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js?v=' + APP_VERSION).catch(() => {});   // версия кэша берётся отсюда — sw.js править не нужно
</script>
</body>
</html>
